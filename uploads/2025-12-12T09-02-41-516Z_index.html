<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一键点歌 | 为学生解决在校园里无法点歌的烦恼</title>
  <style>
    :root {
      --primary: #3d5afe;
      --primary-weak: #e8ecff;
      --bg: #f7f9fc;
      --card: #ffffff;
      --text: #1f2430;
      --muted: #5c6475;
      --border: #e6e8f0;
      --shadow: 0 10px 30px rgba(32, 60, 141, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Inter", "Noto Sans SC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .page {
      max-width: 1140px;
      padding: 32px 20px 60px;
      margin: 0 auto;
    }
    .hero {
      background: linear-gradient(135deg, #f3f6ff, #f9fbff);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 18px;
      padding: 26px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }
    .title {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0.5px;
    }
    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      font-size: 12px;
      color: var(--primary);
      margin: 0 0 6px;
    }
    .tagline {
      margin: 6px 0 0;
      color: var(--muted);
    }
    .hero-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }
    button {
      border: none;
      cursor: pointer;
      border-radius: 12px;
      transition: transform 0.08s ease, box-shadow 0.16s ease, background 0.16s ease;
    }
    .primary-btn {
      background: var(--primary);
      color: #fff;
      padding: 12px 18px;
      font-weight: 700;
      box-shadow: 0 8px 20px rgba(61, 90, 254, 0.25);
    }
    .primary-btn:hover { transform: translateY(-1px); }
    .ghost-btn {
      background: var(--primary-weak);
      color: var(--primary);
      padding: 12px 16px;
      font-weight: 600;
      border: 1px solid #d6ddff;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 16px;
      padding: 18px 18px 6px;
      margin-top: 22px;
    }
    .panel h3 { margin: 0 0 10px; font-size: 18px; }
    .input-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    label {
      font-weight: 700;
      color: var(--muted);
      font-size: 14px;
    }
    input[type="text"] {
      flex: 1;
      min-width: 220px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 14px;
      color: var(--text);
      outline: none;
    }
    textarea {
      width: 100%;
      min-height: 88px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 14px;
      color: var(--text);
      outline: none;
      resize: vertical;
    }
    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(61, 90, 254, 0.15);
    }
    textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(61, 90, 254, 0.15);
    }
    .status {
      color: var(--muted);
      font-size: 14px;
      margin-top: 8px;
    }
    .status strong { color: var(--text); }
    .song-list {
      margin-top: 18px;
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    }
    .song-card {
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 14px;
      box-shadow: var(--shadow);
      border-radius: 14px;
      color: inherit;
    }
    .song-card:hover { transform: translateY(-2px); }
    .song-title {
      margin: 0 0 4px;
      font-weight: 700;
      font-size: 16px;
    }
    .song-meta { color: var(--muted); font-size: 13px; margin: 0 0 6px; }
    .pill {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--primary-weak);
      color: var(--primary);
      font-weight: 700;
      font-size: 12px;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .tiny {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .detail {
      margin-top: 22px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      border-radius: 16px;
      padding: 18px;
    }
    .detail h3 { margin: 0 0 10px; }
    .detail .heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .detail .title-line {
      font-weight: 800;
      font-size: 20px;
      margin: 6px 0;
    }
    .section h4 { margin: 12px 0 6px; font-size: 15px; }
    .section p {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
      padding: 30px 0;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 12px;
      margin-top: 10px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .helper {
      color: var(--muted);
      font-size: 12px;
      margin: 0;
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div>
        <p class="eyebrow">产品名称</p>
        <h1 class="title">一键点歌</h1>
        <p class="tagline">为学生解决在校园里无法点歌的烦恼，简单一点即可表达心情。</p>
      </div>
      <div class="hero-actions">
        <button id="randomBtn" class="primary-btn">一键推荐</button>
        <button id="firstBtn" class="ghost-btn">选回默认歌曲</button>
      </div>
    </section>

    <section class="panel">
      <h3>我要点歌</h3>
      <div class="form-grid">
        <div class="field">
          <label for="newTitle">歌曲名字 *</label>
          <input id="newTitle" type="text" placeholder="例如：Yesterday Once More">
        </div>
        <div class="field">
          <label for="newArtist">歌手名字 *</label>
          <input id="newArtist" type="text" placeholder="例如：Carpenters">
        </div>
      </div>
      <div class="field" style="margin-top: 12px;">
        <label for="newReason">推荐/介绍原因 *</label>
        <textarea id="newReason" placeholder="写下你想点这首歌的理由，或想分享的故事"></textarea>
        <p class="helper">提交后会自动加入列表，方便播放或分享（无评论功能）。</p>
      </div>
      <div style="margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center;">
        <button id="submitSongBtn" class="primary-btn" type="button">提交点歌</button>
        <span id="submitStatus" class="status"></span>
      </div>
    </section>

    <section class="panel">
      <h3>点歌台（MVP）</h3>
      <div class="input-row">
        <label for="searchInput">点歌 / 搜索</label>
        <input id="searchInput" type="text" placeholder="输入歌名、歌手或心情关键词">
        <button id="clearBtn" class="ghost-btn">清空搜索</button>
      </div>
      <p class="status">当前已点：<strong id="currentTitle">-</strong></p>
      <div id="songList" class="song-list"></div>
    </section>

    <section id="detailPanel" class="detail">
      <div class="heading">
        <div>
          <p class="eyebrow">歌曲详情</p>
          <div class="title-line" id="detailTitle">请选择一首歌</div>
          <p class="song-meta" id="detailMeta"></p>
        </div>
        <span class="pill" id="detailMood">心情</span>
      </div>
      <div class="section">
        <h4>故事与立意</h4>
        <p id="detailStory">点击列表中的歌曲即可查看背后的故事。</p>
      </div>
      <div class="section">
        <h4>推荐原因</h4>
        <p id="detailReason">为你解释推荐的理由，帮助你快速选择。</p>
      </div>
    </section>
  </main>

  <script>
    const songs = [
      {
        title: "夜空中最亮的星",
        artist: "逃跑计划",
        mood: "鼓励 / 思考",
        tags: ["励志", "吉他", "陪伴"],
        story: "乐队在全国巡演时，用这首歌写下了对茫然和坚持的回应：即便前路迷雾，也要抬头寻找那颗属于自己的星。",
        reason: "适合在图书馆夜读或走在校园路上聆听，给自己一点光与勇气。"
      },
      {
        title: "稻香",
        artist: "周杰伦",
        mood: "治愈 / 怀旧",
        tags: ["童年", "乡村", "放松"],
        story: "创作灵感来自小时候乡村的稻田与晚风，提醒大家回头看看初心与最朴素的快乐。",
        reason: "当学习压力大时，听一首让人放松的歌，重新找回简单的幸福感。"
      },
      {
        title: "平凡之路",
        artist: "朴树",
        mood: "成长 / 反思",
        tags: ["电影主题曲", "旅途", "成长"],
        story: "为电影《后会无期》创作，讲述在旅途中接受自我、与平凡和解的过程。",
        reason: "毕业季或迷茫时听，告诉自己走在平凡路上也能看见风景。"
      },
      {
        title: "起风了",
        artist: "买辣椒也用券",
        mood: "坚定 / 温柔",
        tags: ["翻唱", "诗意", "坚韧"],
        story: "翻唱自高桥优的《ヤキモチ》，歌词勾勒了面对风浪仍选择出发的勇气与温柔。",
        reason: "考试前或比赛前播放，像轻轻的拥抱，提醒你别怕风大。"
      },
      {
        title: "理想三旬",
        artist: "陈鸿宇",
        mood: "文艺 / 沉静",
        tags: ["民谣", "书卷气", "思考"],
        story: "写给在城市打拼的年轻人，记录对理想与现实的拉扯，温柔又坦诚。",
        reason: "自习时当背景，平稳的旋律让思绪更专注也更柔软。"
      },
      {
        title: "你曾是少年",
        artist: "S.H.E",
        mood: "青春 / 纪念",
        tags: ["校园", "合唱", "回忆"],
        story: "三人以轻快旋律回望青春，提醒每个听者：无论在哪里，都别忘了初心里的闪光。",
        reason: "班级或社团活动合唱首选，让大家一起找回少年时的热烈。"
      },
      {
        title: "Shape of You",
        artist: "Ed Sheeran",
        mood: "轻快 / 舞动",
        tags: ["流行", "节奏感", "律动"],
        story: "灵感来自健身房与夜晚的舞池，把城市日常与暧昧心情写进旋律。",
        reason: "社团派对或跑步热身的背景曲，几秒就能带动气氛。"
      },
      {
        title: "Viva La Vida",
        artist: "Coldplay",
        mood: "史诗 / 振奋",
        tags: ["弦乐", "宏大", "合唱"],
        story: "用落魄国王的第一视角讲述兴衰，配上管弦编排，给听众代入式的电影感。",
        reason: "早八路上或备赛时听，旋律瞬间拉满能量与格局感。"
      },
      {
        title: "Believer",
        artist: "Imagine Dragons",
        mood: "励志 / 爆发",
        tags: ["摇滚", "电子", "燃"],
        story: "主唱将伤痛转化为力量，强烈鼓点和呐喊式唱腔直击情绪。",
        reason: "运动会、拉练或考试前循环，帮助把压力转为动力。"
      },
      {
        title: "Someone Like You",
        artist: "Adele",
        mood: "抒情 / 治愈",
        tags: ["钢琴", "灵魂", "慢板"],
        story: "在钢琴伴奏里讲述放下与祝福，Adele的嗓音直白而温柔。",
        reason: "夜晚独处或需要情绪出口时播放，陪你慢慢消化心事。"
      },
      {
        title: "Counting Stars",
        artist: "OneRepublic",
        mood: "积极 / 律动",
        tags: ["流行摇滚", "口哨", "轻快"],
        story: "主唱在忙碌巡演中写下，关于在现实与梦想间寻找平衡的思考。",
        reason: "下午茶或宿舍收拾房间时的提神曲，节奏轻盈不压迫。"
      },
      {
        title: "See You Again",
        artist: "Wiz Khalifa ft. Charlie Puth",
        mood: "怀念 / 温暖",
        tags: ["电影插曲", "钢琴", "合唱"],
        story: "为《速度与激情》致敬保罗·沃克而作，表达告别、思念与再相见的承诺。",
        reason: "毕业季或告别聚会播放，既有力量也有温柔的拥抱感。"
      },
      {
        title: "Love Story",
        artist: "Taylor Swift",
        mood: "甜蜜 / 勇敢",
        tags: ["乡村流行", "校园", "表白"],
        story: "取材于经典爱情故事但改写成勇敢拥抱的结局，展现青春敢爱的态度。",
        reason: "校园表白或活动背景曲，旋律轻快、歌词好记，氛围感十足。"
      },
      {
        title: "drivers license",
        artist: "Olivia Rodrigo",
        mood: "抒情 / 释怀",
        tags: ["流行", "钢琴", "青春"],
        story: "拿到驾照后夜间兜风的独白，记录分开后的回忆与成长的痛感。",
        reason: "失恋或夜跑时听，帮助释放情绪、找到共鸣再继续向前。"
      },
      {
        title: "From The Start",
        artist: "Laufey",
        mood: "慵懒 / 甜蜜",
        tags: ["爵士流行", "小号", "温柔"],
        story: "复古爵士编曲与轻声吟唱，讲述暧昧与心动的慢慢靠近。",
        reason: "自习或咖啡时间的低声陪伴，旋律轻柔不打扰专注。"
      },
      {
        title: "Snooze",
        artist: "SZA",
        mood: "慵懒 / 深情",
        tags: ["R&B", "节奏", "情绪"],
        story: "在丝滑贝斯与鼓点上描述亲密关系的依赖与安全感，柔软又坚定。",
        reason: "晚间放松或宿舍小憩时播放，沉入舒缓节奏，慢慢放松。"
      },
      {
        title: "You’re On Your Own, Kid",
        artist: "Taylor Swift",
        mood: "成长 / 释怀",
        tags: ["流行", "讲述感", "自我成长"],
        story: "用青春记忆串起孤独、奋斗与自我和解的旅程，从卧室到大舞台的心路记录。",
        reason: "备考或深夜复盘时听，提醒自己能靠着勇气和创意走出路。"
      },
      {
        title: "Set Me Free",
        artist: "Joshua Bassett",
        mood: "自我 / 松绑",
        tags: ["流行", "钢琴", "真诚"],
        story: "写在争议与压力后，对外界噪音说“放我自由”，也是给自己的宽恕信。",
        reason: "当被误解或焦虑困扰时播放，跟着旋律一起把重担卸下。"
      }
    ];

    const songListEl = document.getElementById("songList");
    const searchInput = document.getElementById("searchInput");
    const currentTitle = document.getElementById("currentTitle");
    const detailTitle = document.getElementById("detailTitle");
    const detailMeta = document.getElementById("detailMeta");
    const detailMood = document.getElementById("detailMood");
    const detailStory = document.getElementById("detailStory");
    const detailReason = document.getElementById("detailReason");
    const newTitle = document.getElementById("newTitle");
    const newArtist = document.getElementById("newArtist");
    const newReason = document.getElementById("newReason");
    const submitSongBtn = document.getElementById("submitSongBtn");
    const submitStatus = document.getElementById("submitStatus");

    function renderSongs(filterText = "") {
      const text = filterText.trim().toLowerCase();
      songListEl.innerHTML = "";

      const filtered = songs.filter(song => {
        if (!text) return true;
        const haystack = [song.title, song.artist, song.mood, ...(song.tags || [])]
          .join(" ")
          .toLowerCase();
        return haystack.includes(text);
      });

      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "没有找到匹配的歌曲，试试换个关键词或点击「一键推荐」。";
        songListEl.appendChild(empty);
        return;
      }

      filtered.forEach(song => {
        const btn = document.createElement("button");
        btn.className = "song-card";
        btn.type = "button";
        btn.innerHTML = `
          <p class="song-title">${song.title}</p>
          <p class="song-meta">${song.artist}</p>
          <div class="card-footer">
            <span class="pill">${song.mood}</span>
            <span class="tiny">${song.tags.slice(0, 2).join(" · ")}</span>
          </div>
          <p class="tiny">${song.reason}</p>
        `;
        btn.addEventListener("click", () => {
          showSong(song);
          document.getElementById("detailPanel").scrollIntoView({ behavior: "smooth" });
        });
        songListEl.appendChild(btn);
      });
    }

    function showSong(song) {
      currentTitle.textContent = `${song.title} — ${song.artist}`;
      detailTitle.textContent = song.title;
      detailMeta.textContent = `${song.artist} · 推荐心情：${song.mood}`;
      detailMood.textContent = song.mood;
      detailStory.textContent = song.story;
      detailReason.textContent = song.reason;
    }

    document.getElementById("randomBtn").addEventListener("click", () => {
      const randomSong = songs[Math.floor(Math.random() * songs.length)];
      showSong(randomSong);
      document.getElementById("detailPanel").scrollIntoView({ behavior: "smooth" });
    });

    document.getElementById("firstBtn").addEventListener("click", () => {
      showSong(songs[0]);
      searchInput.value = "";
      renderSongs();
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      searchInput.value = "";
      renderSongs();
    });

    searchInput.addEventListener("input", (e) => {
      renderSongs(e.target.value);
    });

    submitSongBtn.addEventListener("click", () => {
      const title = newTitle.value.trim();
      const artist = newArtist.value.trim();
      const reason = newReason.value.trim();
      if (!title || !artist || !reason) {
        submitStatus.textContent = "请填写歌曲名、歌手和推荐原因。";
        submitStatus.style.color = "crimson";
        return;
      }
      const song = {
        title,
        artist,
        mood: "用户自选 / 点歌",
        tags: ["用户点歌"],
        story: reason,
        reason
      };
      songs.unshift(song);
      renderSongs(searchInput.value);
      showSong(song);
      submitStatus.textContent = "已加入列表，快去播放！";
      submitStatus.style.color = "#1f2430";
      newTitle.value = "";
      newArtist.value = "";
      newReason.value = "";
      document.getElementById("detailPanel").scrollIntoView({ behavior: "smooth" });
    });

    // 初始化
    renderSongs();
    showSong(songs[0]);
  </script>
</body>
</html>
