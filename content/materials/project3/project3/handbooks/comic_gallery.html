<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SASU AI Lab - 行业黑话邮票集</title>
    <style>
        :root {
            --postal-green: #00643a; /* China Post Greenish */
            --paper-color: #f7f3e8;
            --stamp-bg: #fff;
            --stamp-border-color: #e0e0e0;
            --text-color: #333;
            --font-serif: "Georgia", "Times New Roman", serif;
            --font-sans: "Helvetica Neue", "Arial", sans-serif;
        }

        body {
            font-family: var(--font-sans);
            background-color: var(--postal-green);
            margin: 0;
            padding: 0;
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* Prevent scrolling, use JS carousel */
        }

        /* --- Header --- */
        header {
            background-color: rgba(255,255,255,0.1);
            color: #fff;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
        }

        h1 {
            font-family: var(--font-serif);
            font-size: 1.5rem;
            margin: 0;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-controls {
            display: flex;
            gap: 15px;
        }

        .filter-select {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            font-size: 0.9rem;
            background: #fff;
            color: var(--postal-green);
            font-weight: bold;
            cursor: pointer;
            outline: none;
        }

        /* --- Carousel Container --- */
        .carousel-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 20px;
            perspective: 1000px;
        }

        /* --- Stamp Card --- */
        .stamp-card {
            background: var(--stamp-bg);
            width: 100%;
            max-width: 800px;
            height: auto;
            max-height: 85vh;
            aspect-ratio: 1.4 / 1; /* Postcard/Stamp ratio */
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            
            /* Stamp Perforations effect */
            border: 1px solid transparent;
            background-clip: padding-box;
        }
        
        /* The perforated edge look using radial gradient mask is tricky,
           using a simpler border style for compatibility and cleanness,
           or using a pseudo element for the "serrated" look.
           Let's use a "serrated" border image or css trick.
        */
        .stamp-card::before {
            content: "";
            position: absolute;
            top: -5px; bottom: -5px; left: -5px; right: -5px;
            background: radial-gradient(transparent 50%, var(--postal-green) 50%) repeat;
            background-size: 20px 20px;
            z-index: -1;
            /* This is a simple visual trick, simplistic but effective */
        }
        
        /* Simulating a cleaner stamp look with a white border inside a dark container */
        .stamp-inner {
            flex: 1;
            margin: 15px; /* The white border of the stamp */
            border: 1px solid #ddd;
            display: flex;
            flex-direction: row; /* Horizontal layout for desktop */
            background: #fafafa;
            position: relative;
        }

        /* Left Side: Visual/Comic */
        .stamp-visual {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            border-right: 2px dashed #ccc; /* Perforation line in middle */
            position: relative;
        }
        
        .comic-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }
        
        .comic-panel.problem {
            background-color: #fff5f5;
            border-bottom: 1px solid #eee;
        }
        
        .comic-panel.solution {
            background-color: #f0fff4;
        }
        
        .emoji-actor {
            font-size: 4rem;
            margin-right: 20px;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.1));
        }

        .speech-bubble {
            background: #fff;
            border: 2px solid #333;
            border-radius: 15px;
            padding: 10px 15px;
            position: relative;
            font-family: "Comic Sans MS", "Chalkboard SE", sans-serif;
            font-size: 0.9rem;
            max-width: 180px;
            box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
        }
        
        /* Right Side: Info/Text */
        .stamp-info {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background-image: linear-gradient(90deg, transparent 95%, #eee 95%);
            background-size: 100% 20px; /* Writing lines hint */
        }

        .stamp-header {
            border-bottom: 2px solid var(--postal-green);
            margin-bottom: 20px;
            padding-bottom: 10px;
        }
        
        .stamp-title {
            font-family: var(--font-serif);
            font-size: 1.8rem;
            color: #333;
            margin: 0;
            line-height: 1.2;
        }
        
        .stamp-role {
            font-size: 0.8rem;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 2px;
            margin-top: 5px;
            display: block;
        }
        
        .stamp-def {
            font-style: italic;
            color: #555;
            margin-bottom: 20px;
            font-size: 1.1rem;
            font-family: var(--font-serif);
        }

        .stamp-principle {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #444;
            margin-bottom: 20px;
        }
        
        .stamp-action {
            color: var(--postal-green);
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
        }

        /* Postmark (Stamp cancellation mark) */
        .postmark {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 80px;
            height: 80px;
            border: 2px solid rgba(200, 0, 0, 0.4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(200, 0, 0, 0.4);
            font-size: 0.7rem;
            font-weight: bold;
            text-align: center;
            transform: rotate(-15deg);
            pointer-events: none;
            z-index: 10;
            background: transparent;
        }
        .postmark-lines {
            position: absolute;
            top: 50%;
            left: -40px;
            width: 160px;
            height: 20px;
            border-top: 2px solid rgba(200, 0, 0, 0.4);
            border-bottom: 2px solid rgba(200, 0, 0, 0.4);
            transform: rotate(0deg);
        }

        /* --- Navigation --- */
        .nav-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            font-size: 2rem;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
        }

        .nav-btn:hover {
            background: rgba(255,255,255,0.4);
            transform: translateY(-50%) scale(1.1);
        }

        .nav-prev { left: 40px; }
        .nav-next { right: 40px; }
        
        .counter {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.7);
            font-size: 1rem;
            letter-spacing: 2px;
        }

        /* Animation */
        .fade-enter {
            animation: fadeIn 0.5s ease forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Mobile Adapt */
        @media (max-width: 768px) {
            .stamp-inner {
                flex-direction: column;
                overflow-y: auto;
            }
            .stamp-visual {
                flex: none;
                height: 200px;
                border-right: none;
                border-bottom: 2px dashed #ccc;
            }
            .stamp-info {
                flex: none;
                padding: 20px;
            }
            .nav-btn {
                width: 40px;
                height: 40px;
                font-size: 1.5rem;
                padding: 0;
                background: rgba(0,0,0,0.3);
            }
            .nav-prev { left: 10px; }
            .nav-next { right: 10px; }
            .emoji-actor { font-size: 2.5rem; }
            .speech-bubble { font-size: 0.8rem; }
        }

    </style>
</head>

                return;

            const item = filteredData[currentIndex];
            
            // Generate Random Postmark Date
            const now = new Date();
            const dateStr = `${now.getFullYear()}.${now.getMonth()+1}.${now.getDate()}`;

            container.classList.remove('fade-enter');
            void container.offsetWidth; // trigger reflow
            container.classList.add('fade-enter');

            container.innerHTML = `
                <div class="stamp-inner">
                    <div class="postmark">
                        <div class="postmark-lines"></div>
                        AI POST<br>${dateStr}<br>${item.role}
                    </div>

                    <div class="stamp-visual">
                        <div class="comic-panel problem">
                            <div class="emoji-actor">${item.panel1.emoji}</div>
                            <div class="speech-bubble">${item.panel1.text}</div>
                        </div>
                        <div class="comic-panel solution">
                            <div class="emoji-actor">${item.panel2.emoji}</div>
                            <div class="speech-bubble">${item.panel2.text}</div>
                        </div>
                    </div>
                    
                    <div class="stamp-info">
                        <div class="stamp-header">
                            <h2 class="stamp-title">${item.term}</h2>
                            <span class="stamp-role">${item.icon} ${item.roleName} | ${item.definition}</span>
                        </div>
                        
                        <p class="stamp-def">
                            "${item.principle}"
                        </p>
                        
                        <p class="stamp-principle">
                            <strong>应用指南：</strong>
                            ${item.action}
                        </p>
                    </div>
                </div>
            `;

            counter.textContent = `${currentIndex + 1} / ${filteredData.length}`;
        }

        // 3. Navigation Controls
        function changeSlide(direction) {
            currentIndex += direction;
            if (currentIndex < 0) {
                currentIndex = filteredData.length - 1;
            } else if (currentIndex >= filteredData.length) {
                currentIndex = 0;
            }
            renderSlide();
        }

        // Keyboard Support
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') changeSlide(-1);
            if (e.key === 'ArrowRight') changeSlide(1);
        });

        // Initial Render
        renderSlide();

    </script>
</body>
</html>
