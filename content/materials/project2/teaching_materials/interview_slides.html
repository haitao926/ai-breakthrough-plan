<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PM & PJM 面试题库</title>
<style>
  :root {
      --pm-color: #e67e22;
      --pm-bg: #fdf2e9;
      --pjm-color: #27ae60;
      --pjm-bg: #e9f7ef;
      --text-main: #2c3e50;
  }
  body {
      margin: 0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: #f4f6f9;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
  }
  .card {
      width: 90%;
      max-width: 900px;
      height: 85vh;
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
      padding: 60px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-y: auto;
      transition: border-top-color 0.3s;
      border-top: 12px solid #ccc;
  }
  .theme-pm { border-top-color: var(--pm-color); }
  .theme-pjm { border-top-color: var(--pjm-color); }

  .badge {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 1em;
      font-weight: 700;
      margin-bottom: 25px;
      align-self: flex-start;
  }
  .theme-pm .badge { background: var(--pm-bg); color: var(--pm-color); }
  .theme-pjm .badge { background: var(--pjm-bg); color: var(--pjm-color); }

  h1 { font-size: 2.2em; margin: 0 0 30px 0; color: var(--text-main); line-height: 1.3; }

  .question-box {
      font-size: 1.5em;
      color: #34495e;
      line-height: 1.6;
      margin-bottom: 40px;
      flex-grow: 1;
      font-weight: 400;
  }
  
  .timer-display {
      font-size: 1.2em;
      font-weight: bold;
      color: #e74c3c;
      margin-top: 10px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
  }

  .answer-box {
      background: #fafafa;
      border-radius: 16px;
      padding: 30px;
      border-left: 6px solid #ccc;
      display: none;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.4s ease;
      margin-top: 20px;
  }
  .theme-pm .answer-box { border-color: var(--pm-color); background: #fffbf5; }
  .theme-pjm .answer-box { border-color: var(--pjm-color); background: #f0fbf4; }

  .answer-box.show { display: block; opacity: 1; transform: translateY(0); }
  
  .answer-box p { margin: 12px 0; font-size: 1.15em; line-height: 1.7; color: #444; }
  .answer-box strong { color: #000; background: rgba(255,255,0,0.25); padding: 0 4px; font-weight: 700; }

  .controls {
      position: fixed;
      bottom: 30px;
      display: flex;
      gap: 20px;
      background: rgba(255,255,255,0.9);
      padding: 15px 30px;
      border-radius: 50px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      backdrop-filter: blur(10px);
      z-index: 100;
  }

  button {
      padding: 12px 28px;
      border: none;
      background: #ecf0f1;
      color: #2c3e50;
      border-radius: 30px;
      cursor: pointer;
      font-size: 1.1em;
      font-weight: 600;
      transition: transform 0.2s, background 0.2s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
  }
  button:hover { transform: translateY(-2px); background: #bdc3c7; }
  
  button.reveal-btn { background: #2c3e50; color: white; min-width: 160px; }
  button.reveal-btn:hover { background: #1a252f; }

  .counter { position: absolute; top: 30px; right: 40px; color: #bdc3c7; font-weight: 700; font-size: 1.3em; }
</style>
</head>
<body>

<div class="card" id="card">
    <div class="badge" id="categoryBadge">Category</div>
    <div class="counter" id="counter">1 / 40</div>
    <h1 id="title">Title</h1>
    <div class="question-box" id="question">Question...</div>
    <div class="timer-display" id="timerDisplay">⏳ 思考倒计时: <span id="timerVal">30</span>s</div>
    <div class="answer-box" id="answerBox"><div id="answerContent"></div></div>
</div>

<div class="controls">
    <button onclick="changeSlide(-1)">← 上一题</button>
    <button class="reveal-btn" onclick="toggleAnswer()" id="revealBtn">👀 查看深度解析</button>
    <button onclick="changeSlide(1)">下一题 →</button>
</div>

let currentIndex = 0;
const card = document.getElementById('card');
const categoryBadge = document.getElementById('categoryBadge');
const titleEl = document.getElementById('title');
const questionEl = document.getElementById('question');
const answerBox = document.getElementById('answerBox');
const answerContent = document.getElementById('answerContent');
const counterEl = document.getElementById('counter');
const revealBtn = document.getElementById('revealBtn');
const timerValEl = document.getElementById('timerVal');
const timerDisplayEl = document.getElementById('timerDisplay');

let timerInterval = null;
const TIME_LIMIT = 30;

function startTimer() {
    clearInterval(timerInterval);
    let timeLeft = TIME_LIMIT;
    timerValEl.textContent = timeLeft;
    timerDisplayEl.style.opacity = 1;
    
    timerInterval = setInterval(() => {
        timeLeft--;
        timerValEl.textContent = timeLeft;
        
        if (timeLeft <= 0) {
            clearInterval(timerInterval);
            // 自动显示答案，但不自动滚动到底部（防止突然跳动干扰）
            if (!answerBox.classList.contains('show')) {
                toggleAnswer(false);
            }
        }
    }, 1000);
}

function resetTimer() {
    clearInterval(timerInterval);
    timerValEl.textContent = TIME_LIMIT;
}

function renderSlide(index) {
    const slide = slides[index];
    
    if (slide.category.includes("产品")) {
        card.className = "card theme-pm";
    } else {
        card.className = "card theme-pjm";
    }
    
    categoryBadge.textContent = slide.category;
    titleEl.textContent = slide.title;
    questionEl.innerHTML = slide.question;
    answerContent.innerHTML = slide.answer;
    
    answerBox.className = "answer-box"; 
    revealBtn.textContent = "👀 查看深度解析";
    counterEl.textContent = (index + 1) + " / " + slides.length;
    
    // 重置并开始计时
    resetTimer();
    // 稍微延迟启动，让切题动画流畅
    setTimeout(startTimer, 100);
}

function changeSlide(direction) {
    const newIndex = currentIndex + direction;
    if (newIndex >= 0 && newIndex < slides.length) {
        currentIndex = newIndex;
        renderSlide(currentIndex);
    }
}

function toggleAnswer(autoScroll = true) {
    // 无论是手动还是自动触发，只要答案显示了，就停止计时
    clearInterval(timerInterval);
    
    if (answerBox.classList.contains('show')) {
        answerBox.classList.remove('show');
        revealBtn.textContent = "👀 查看深度解析";
    } else {
        answerBox.classList.add('show');
        revealBtn.textContent = "🙈 隐藏解析";
        if (autoScroll) {
            setTimeout(() => {
                card.scrollTo({ top: card.scrollHeight, behavior: 'smooth' });
            }, 100);
        }
    }
}

document.addEventListener('keydown', (e) => {
    if (e.key === "ArrowRight") changeSlide(1);
    if (e.key === "ArrowLeft") changeSlide(-1);
    if (e.key === " " || e.key === "Enter") toggleAnswer();
});

renderSlide(0);
</script>
