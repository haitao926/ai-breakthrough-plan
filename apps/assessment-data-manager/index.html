<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考试数据管理 | Assessment Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
    <div class="max-w-5xl mx-auto px-6 py-8">
        <header class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">考试数据管理</h1>
                <p class="text-sm text-gray-500">上传 CSV，供学情分析与成绩单生成使用。</p>
            </div>
            <div class="text-sm text-gray-500">
                当前用户：<span id="currentUser" class="font-bold text-gray-700">-</span>
            </div>
        </header>

        <section class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-8">
            <h2 class="text-lg font-bold text-gray-900 mb-4">上传 CSV</h2>
            <form id="uploadForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">数据集名称</label>
                    <input id="datasetTitle" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="例如：2025-下学期-期末成绩">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">CSV 文件</label>
                    <input id="datasetFile" type="file" accept=".csv,text/csv" class="w-full text-sm">
                </div>
                <div class="flex items-center gap-3">
                    <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-bold">上传</button>
                    <span id="uploadStatus" class="text-sm text-gray-500"></span>
                </div>
            </form>
        </section>

        <section class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
            <h2 class="text-lg font-bold text-gray-900 mb-4">已上传数据</h2>
            <div id="listStatus" class="text-sm text-gray-400 mb-3">加载中...</div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead class="bg-gray-50 text-gray-500">
                        <tr>
                            <th class="p-3 font-bold">名称</th>
                            <th class="p-3 font-bold">文件名</th>
                            <th class="p-3 font-bold">大小</th>
                            <th class="p-3 font-bold">上传时间</th>
                            <th class="p-3 font-bold text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody id="fileTableBody" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/assessment/app.js"></script>
</body>
</html>
