<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>考试数据管理 | Assessment Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .btn-gradient {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.2);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .btn-gradient:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px 0 rgba(99, 102, 241, 0.35);
            background: linear-gradient(135deg, #4f46e5, #4338ca);
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-indigo-50/40 via-slate-50 to-indigo-50/10">
    <div class="max-w-5xl mx-auto px-6 py-12">
        <header class="flex items-center justify-between mb-10 pb-6 border-b border-indigo-100/50">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900 tracking-tight">考试数据管理</h1>
                <p class="text-sm font-semibold text-slate-500 mt-1">上传及更新 CSV 考试成绩集，为学情分析提供基础数据</p>
            </div>
            <div class="text-sm font-bold text-slate-600 bg-indigo-50/80 px-4 py-2 rounded-2xl border border-indigo-100/50">
                当前用户：<span id="currentUser" class="text-indigo-600">-</span>
            </div>
        </header>

        <section class="glass-card rounded-[24px] p-8 mb-8 shadow-sm">
            <h2 class="text-lg font-extrabold text-slate-900 mb-6 flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-indigo-600"></span>
                上传新数据集 (CSV)
            </h2>
            <form id="uploadForm" class="space-y-6">
                <div class="grid md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">数据集名称</label>
                        <input id="datasetTitle" class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl focus:bg-white focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100 outline-none transition-all duration-200 font-semibold" placeholder="例如：2025-下学期-期末成绩">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">CSV 文件</label>
                        <input id="datasetFile" type="file" accept=".csv,text/csv" class="w-full text-sm font-semibold text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-extrabold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100 file:cursor-pointer transition-all duration-200">
                    </div>
                </div>
                <div class="flex items-center gap-4 pt-2">
                    <button type="submit" class="btn-gradient px-6 py-3 text-white rounded-xl text-xs font-extrabold tracking-wider uppercase">开始上传</button>
                    <span id="uploadStatus" class="text-xs font-bold text-slate-500"></span>
                </div>
            </form>
        </section>

        <section class="glass-card rounded-[24px] p-8 shadow-sm">
            <h2 class="text-lg font-extrabold text-slate-900 mb-4 flex items-center gap-2">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                已上传数据集
            </h2>
            <div id="listStatus" class="text-xs font-bold text-slate-400 mb-6">加载中...</div>
            <div class="overflow-x-auto">
                <table class="w-full text-sm text-left">
                    <thead>
                        <tr class="border-b border-slate-100 text-xs font-extrabold text-slate-400 uppercase tracking-wider">
                            <th class="pb-4 font-bold">名称</th>
                            <th class="pb-4 font-bold">文件名</th>
                            <th class="pb-4 font-bold">大小</th>
                            <th class="pb-4 font-bold">上传时间</th>
                            <th class="pb-4 font-bold text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody id="fileTableBody" class="divide-y divide-slate-100 font-semibold text-slate-700"></tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="/js/auth.js"></script>
    <script src="/assessment/app.js"></script>
</body>
</html>
