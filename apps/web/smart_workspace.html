<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 科创探究工坊 | Inquiry Workspace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .stage-btn { @apply w-12 h-12 rounded-xl flex items-center justify-center text-white/60 hover:text-white hover:bg-white/10 transition cursor-pointer mb-4; }
        .stage-btn.active { @apply bg-indigo-600 text-white shadow-lg; }
        .step-item.active { background-color: #e0e7ff; color: #4338ca; border-right: 3px solid #4338ca; }
        .step-item { color: #64748b; border-right: 3px solid transparent; }
        .step-item:hover { background-color: #f1f5f9; }
        .wbs-col { min-height: 300px; }
        .wbs-card { cursor: grab; transition: all 0.2s; border-left: 3px solid transparent; }
        .wbs-card:active { cursor: grabbing; }
        .wbs-card:hover { border-left-color: #6366f1; background-color: #fafafa; }
    </style>
</head>
<body class="h-screen flex overflow-hidden">

    <!-- 2. Step Nav (Secondary -> Now Primary) -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col z-20 shadow-sm shrink-0">
        <div class="h-16 flex items-center px-6 border-b border-gray-100">
            <a href="workspace.html" class="mr-3 text-gray-400 hover:text-indigo-600 transition"><i class="fas fa-arrow-left"></i></a>
            <span class="font-bold text-gray-800 tracking-tight" id="stage-title">立项阶段</span>
        </div>
        <div class="flex-1 overflow-y-auto py-4">
            <div id="menu-inception">
                <div class="px-6 mb-2 text-xs font-bold text-indigo-600 uppercase">顶层设计</div>
                <nav class="space-y-1">
                    <button onclick="loadStep('goal_definition')" id="nav-goal_definition" class="step-item w-full flex items-center px-6 py-3 text-sm font-medium transition">1.1 目标定调</button>
                    <button onclick="loadStep('architecture')" id="nav-architecture" class="step-item w-full flex items-center px-6 py-3 text-sm font-medium transition">1.2 架构设计</button>
                    <button onclick="loadStep('wbs_planning')" id="nav-wbs_planning" class="step-item w-full flex items-center px-6 py-3 text-sm font-medium transition">1.3 路径规划</button>
                </nav>
                <div class="px-6 mb-2 mt-6 text-xs font-bold text-red-400 uppercase">关键节点</div>
                <nav class="space-y-1"><button onclick="loadStep('gateway_proposal')" id="nav-gateway_proposal" class="step-item w-full flex items-center px-6 py-3 text-sm font-medium transition border-l-4 border-transparent hover:bg-red-50">🚩 立项评审</button></nav>
            </div>
            <div id="menu-implementation" class="hidden">
                <div class="px-6 mb-2 text-xs font-bold text-blue-600 uppercase">工程实施</div>
                <nav class="space-y-1">
                    <button onclick="loadStep('kanban')" id="nav-kanban" class="step-item w-full flex items-center px-6 py-3 text-sm font-medium transition">2.1 任务看板</button>
                    <button onclick="loadStep('devlog')" id="nav-devlog" class="step-item w-full flex items-center px-6 py-3 text-sm font-medium transition">2.2 实验日志</button>
                    <button onclick="loadStep('resources')" id="nav-resources" class="step-item w-full flex items-center px-6 py-3 text-sm font-medium transition">2.3 物资支持</button>
                </nav>
                <div class="px-6 mb-2 mt-6 text-xs font-bold text-red-400 uppercase">关键节点</div>
                <nav class="space-y-1"><button onclick="loadStep('gateway_midterm')" id="nav-gateway_midterm" class="step-item w-full flex items-center px-6 py-3 text-sm font-medium transition border-l-4 border-transparent hover:bg-red-50">🚩 中期检查</button></nav>
            </div>
            <div id="menu-conclusion" class="hidden">
                <div class="px-6 mb-2 text-xs font-bold text-green-600 uppercase">成果交付</div>
                <nav class="space-y-1">
                    <button onclick="loadStep('delivery_proposal')" id="nav-delivery_proposal" class="step-item w-full flex items-center px-6 py-3 text-sm font-medium transition">3.1 报告生成</button>
                    <button onclick="loadStep('delivery_final')" id="nav-delivery_final" class="step-item w-full flex items-center px-6 py-3 text-sm font-medium transition">3.2 模拟答辩</button>
                </nav>
                <div class="px-6 mb-2 mt-6 text-xs font-bold text-red-400 uppercase">关键节点</div>
                <nav class="space-y-1"><button onclick="loadStep('gateway_final')" id="nav-gateway_final" class="step-item w-full flex items-center px-6 py-3 text-sm font-medium transition border-l-4 border-transparent hover:bg-red-50">🚩 结题验收</button></nav>
            </div>
        </div>
    </aside>

    <!-- 3. Main -->
    <main class="flex-1 overflow-y-auto bg-gray-50 p-8 relative flex flex-col">
        <header class="flex justify-between items-start mb-8 shrink-0">
            <div><h1 class="text-3xl font-bold text-gray-900" id="step-title">加载中...</h1><p class="text-gray-500 mt-2" id="step-desc">...</p></div>
            <div class="flex gap-3" id="header-actions"></div>
        </header>
        <div class="flex-1 flex gap-6 min-h-0">
            <div class="flex-1 bg-white rounded-xl shadow-sm border border-gray-200 p-8 overflow-y-auto relative" id="main-content-area">
                <div class="text-center py-20 text-gray-400"><i class="fas fa-spinner fa-spin text-3xl mb-4"></i><p>数据加载中...</p></div>
            </div>
            <div class="w-80 bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col overflow-hidden flex-none">
                <div class="p-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                    <div class="flex items-center gap-2"><div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white text-xs"><i class="fas fa-robot"></i></div><div><h3 class="font-bold text-gray-800 text-sm">AI 评审顾问</h3><p class="text-xs text-gray-400">实时评估中...</p></div></div>
                </div>
                <div class="flex-1 overflow-y-auto p-4 space-y-4" id="ai-chat-history"></div>
                <div class="p-4 border-t border-gray-100 bg-gray-50">
                    <div class="flex gap-2 mb-2" id="ai-quick-actions"></div>
                    <div class="relative"><input type="text" id="ai-input" class="w-full pl-4 pr-10 py-3 rounded-lg border border-gray-200 text-sm outline-none" placeholder="输入想法..."><button onclick="sendAiMsg()" class="absolute right-2 top-2 w-8 h-8 bg-gray-900 text-white rounded-lg flex items-center justify-center"><i class="fas fa-paper-plane text-xs"></i></button></div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('project');
        
        let projectData = {};
        let wbsTasks = [];

        // --- Render Functions (Defined BEFORE usage) ---
        function renderGoalEditor(c) {
             c.innerHTML = `<div class="space-y-6"><div><label class="block text-sm font-bold text-gray-700 mb-2">项目名称</label><input class="w-full px-4 py-3 border border-gray-200 rounded-lg outline-none" value="${projectData.title||''}"></div><div><label class="block text-sm font-bold text-gray-700 mb-2">核心目标</label><textarea class="w-full p-4 border border-gray-200 rounded-lg h-40 outline-none">${projectData.summary||''}</textarea></div></div>`;
        }
        function renderArchitecture(c) { c.innerHTML = `<iframe src="tools/architect.html" class="w-full h-full border-0 rounded-xl"></iframe>`; }
        
        async function renderWBSBuilder(c) {
            c.innerHTML = '<div class="text-center py-10"><i class="fas fa-spinner fa-spin"></i> Loading...</div>';
            await loadWBS();
            const m1 = wbsTasks.filter(t => t.description === 'm1');
            const m2 = wbsTasks.filter(t => t.description === 'm2');
            const m3 = wbsTasks.filter(t => t.description === 'm3');
            c.innerHTML = `<div class="h-full flex flex-col"><div class="flex gap-4 mb-4"><input id="new-task-input" class="flex-1 px-4 py-2 border rounded-lg" placeholder="新任务..."><button onclick="addTask()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg">添加</button></div><div class="flex-1 grid grid-cols-3 gap-4 overflow-hidden"><div class="bg-gray-50 p-4 rounded-xl flex flex-col"><h4 class="mb-3 font-bold text-sm">里程碑 1</h4><div id="wbs-m1" class="flex-1 space-y-2 overflow-auto" data-phase="m1">${m1.map(t=>`<div class="wbs-card bg-white p-3 rounded shadow-sm border text-sm" data-id="${t.id}">${t.title}</div>`).join('')}</div></div><div class="bg-gray-50 p-4 rounded-xl flex flex-col"><h4 class="mb-3 font-bold text-sm">里程碑 2</h4><div id="wbs-m2" class="flex-1 space-y-2 overflow-auto" data-phase="m2">${m2.map(t=>`<div class="wbs-card bg-white p-3 rounded shadow-sm border text-sm" data-id="${t.id}">${t.title}</div>`).join('')}</div></div><div class="bg-gray-50 p-4 rounded-xl flex flex-col"><h4 class="mb-3 font-bold text-sm">里程碑 3</h4><div id="wbs-m3" class="flex-1 space-y-2 overflow-auto" data-phase="m3">${m3.map(t=>`<div class="wbs-card bg-white p-3 rounded shadow-sm border text-sm" data-id="${t.id}">${t.title}</div>`).join('')}</div></div></div></div>`;
            ['wbs-m1','wbs-m2','wbs-m3'].forEach(id=>{new Sortable(document.getElementById(id),{group:'wbs',onAdd:async(evt)=>{const id=evt.item.getAttribute('data-id');const ph=evt.to.getAttribute('data-phase');await apiFetch(`/milestones/${id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({phase:ph})}})});
        }
        
        async function renderExecutionKanban(container) {
            container.innerHTML = `<iframe src="tools/kanban.html" class="w-full h-full border-0 rounded-xl"></iframe>`;
        }

        async function renderDevLog(c) {
            c.innerHTML = `<div class="flex flex-col h-full"><div class="mb-4"><textarea id="log-in" class="w-full border p-3 rounded" rows="3" placeholder="写日志..."></textarea><button onclick="submitLog()" class="mt-2 bg-indigo-600 text-white px-4 py-1 rounded">发布</button></div><div id="log-list" class="flex-1 overflow-auto">Loading...</div></div>`;
            try {
                const res = await apiFetch(`/projects/${projectId}/logs`);
                const data = await res.json();
                document.getElementById('log-list').innerHTML = (data.logs||[]).map(l=>`<div class="bg-white border p-4 rounded mb-2 shadow-sm">${marked.parse(l.content)}</div>`).join('') || '暂无日志';
            } catch(e){}
        }

        async function renderResources(c) {
            c.innerHTML = `<div class="h-full p-4"><div class="flex gap-2 mb-4"><input id="res-name" class="border p-2 rounded" placeholder="物资名称"><button onclick="submitRes()" class="bg-indigo-600 text-white px-4 rounded">申请</button></div><div id="res-list">Loading...</div></div>`;
            try{
                const res=await apiFetch(`/projects/${projectId}/resources`);
                const data=await res.json();
                document.getElementById('res-list').innerHTML = `<table class="w-full text-sm text-left"><thead class="bg-gray-100"><tr><th class="p-2">名称</th><th class="p-2">状态</th></tr></thead><tbody>${(data.requests||[]).map(r=>`<tr><td class="p-2">${r.item_name}</td><td class="p-2">${r.status}</td></tr>`).join('')}</tbody></table>`;
            }catch(e){}
        }

        async function renderGateway(c, type, label) {
            c.innerHTML = `<div class="max-w-xl mx-auto text-center p-8 bg-white rounded-xl shadow-sm border"><h3 class="text-xl font-bold mb-4">${label}</h3><input type="file" id="gateway-file" class="block w-full mb-4"><button onclick="submitGateway('${type}')" class="bg-red-600 text-white px-8 py-3 rounded-xl font-bold">提交</button></div>`;
        }
        
        async function renderProposalGenerator(c) { c.innerHTML = '<div class="p-8 text-center"><h2 class="text-xl font-bold">报告生成器</h2><textarea class="w-full border p-4 h-64 mt-4"># 项目立项书\n\n(AI 生成的内容)</textarea></div>'; }
        async function renderDefense(c) { c.innerHTML = '<div class="p-8"><h2 class="text-xl font-bold mb-4">模拟答辩</h2><div class="bg-gray-50 p-4 rounded h-64">AI: 请开始你的陈述。</div><input class="w-full border p-2 mt-4" placeholder="回答..."></div>'; }

        // --- Helper Functions ---
        async function addTask() {
            const val=document.getElementById('new-task-input').value;if(!val)return;
            await apiFetch(`/projects/${projectId}/milestones`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:val,phase:'m1'})});
            loadStep('wbs_planning');
        }
        async function submitLog() {
            const c=document.getElementById('log-in').value;
            await apiFetch(`/projects/${projectId}/logs`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:c})});
            loadStep('devlog');
        }
        async function submitRes() {
            const n=document.getElementById('res-name').value;
            await apiFetch(`/projects/${projectId}/resources`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item_name:n,quantity:1})});
            loadStep('resources');
        }
        async function submitGateway(type) {
            const file=document.getElementById('gateway-file').files[0];
            if(!file) return alert('请上传文件');
            const fd=new FormData();
            fd.append('type',type); fd.append('title',type); fd.append('files',file);
            await apiFetch(`/projects/${projectId}/submissions`,{method:'POST',body:fd});
            alert('提交成功');
        }
        function loadWBS(){return apiFetch(`/projects/${projectId}/milestones`).then(r=>r.json()).then(d=>wbsTasks=d.milestones||[]).catch(()=>wbsTasks=[]);}

        // --- Steps Data (Defined LAST to ensure functions exist) ---
        const stepsData = {
            'goal_definition': { title: '1.1 目标定调', desc: '明确研究目标。', render: renderGoalEditor, aiGreeting: '立项第一步：明确目标。', aiActions: [{label:'评估',action:'aiEvaluateGoal',icon:'fas fa-balance-scale',color:'blue'}] },
            'architecture': { title: '1.2 架构设计', desc: '绘制系统结构。', render: renderArchitecture, aiGreeting: '一张图胜过千言万语。', aiActions: [] },
            'wbs_planning': { title: '1.3 路径规划', desc: '拆解任务清单。', render: renderWBSBuilder, aiGreeting: 'WBS 是项目的地图。', aiActions: [{label:'审查',action:'aiReviewWBS',icon:'fas fa-search',color:'purple'}] },
            'gateway_proposal': { title: '🚩 立项评审', desc: '提交立项材料。', render: (c)=>renderGateway(c,'proposal','立项材料'), aiGreeting: '准备提交了吗？', aiActions: [{label:'预审',action:'aiCheckProposal',icon:'fas fa-check',color:'green'}] },
            'kanban': { title: '2.1 任务看板', desc: '管理任务进度。', render: renderExecutionKanban, aiGreeting: '保持看板更新。', aiActions: [] },
            'devlog': { title: '2.2 实验日志', desc: '记录实验过程。', render: renderDevLog, aiGreeting: '遇到问题了吗？', aiActions: [{label:'分析报错',action:'aiDebug',icon:'fas fa-bug',color:'red'}] },
            'resources': { title: '2.3 物资申请', desc: '申请所需物资。', render: renderResources, aiGreeting: '需要什么支持？', aiActions: [] },
            'gateway_midterm': { title: '🚩 中期检查', desc: '提交中期报告。', render: (c)=>renderGateway(c,'midterm','中期报告'), aiGreeting: '检查进度。', aiActions: [] },
            'delivery_proposal': { title: '3.1 报告生成', desc: '生成结题报告草稿。', render: renderProposalGenerator, aiGreeting: '开始撰写报告。', aiActions: [{label:'润色',action:'aiPolishing',icon:'fas fa-pen-nib',color:'green'}] },
            'delivery_final': { title: '3.2 模拟答辩', desc: '模拟答辩现场。', render: renderDefense, aiGreeting: '准备答辩。', aiActions: [{label:'开始',action:'aiStartDefense',icon:'fas fa-microphone',color:'red'}] },
            'gateway_final': { title: '🚩 结题验收', desc: '提交最终成果。', render: (c)=>renderGateway(c,'final','结题材料'), aiGreeting: '祝贺完成！', aiActions: [] }
        };

        // --- Core Logic ---
        function switchStage(stage) {
            document.querySelectorAll('.stage-btn').forEach(b => b.classList.remove('active'));
            const map = { 'inception': 1, 'implementation': 2, 'conclusion': 3 };
            document.getElementById(`btn-stage-${map[stage]}`).classList.add('active');
            ['inception','implementation','conclusion'].forEach(s => document.getElementById(`menu-${s}`).classList.add('hidden'));
            document.getElementById(`menu-${stage}`).classList.remove('hidden');
            const titles = { 'inception': '立项阶段', 'implementation': '实施阶段', 'conclusion': '结题阶段' };
            document.getElementById('stage-title').innerText = titles[stage];
            if (stage === 'inception') loadStep('goal_definition');
            if (stage === 'implementation') loadStep('kanban');
            if (stage === 'conclusion') loadStep('delivery_proposal');
        }

        function loadStep(stepId) {
            const data = stepsData[stepId];
            if(!data) return;
            document.querySelectorAll('.step-item').forEach(el => el.classList.remove('active'));
            const navBtn = document.getElementById('nav-' + stepId);
            if(navBtn) navBtn.classList.add('active');
            document.getElementById('step-title').innerText = data.title;
            document.getElementById('step-desc').innerText = data.desc;
            const history = document.getElementById('ai-chat-history');
            history.innerHTML = `<div class="flex gap-3"><div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white text-xs">AI</div><div class="ai-bubble bg-gray-100 p-3 rounded-lg text-sm text-gray-700 shadow-sm leading-relaxed">${data.aiGreeting}</div></div>`;
            const actions = document.getElementById('ai-quick-actions');
            actions.innerHTML = '';
            (data.aiActions||[]).forEach(act => {
                actions.innerHTML += `<button onclick="${act.action}()" class="flex-1 bg-white border border-${act.color}-200 text-${act.color}-700 hover:bg-${act.color}-50 text-xs py-2 rounded-lg transition shadow-sm"><i class="${act.icon} mr-1"></i> ${act.label}</button>`;
            });
            const container = document.getElementById('main-content-area');
            container.innerHTML = '';
            if (data.render) data.render(container);
        }

        // --- AI Mock ---
        function addAiMessage(text,isUser=false) {
            const h=document.getElementById('ai-chat-history');
            h.innerHTML+=`<div class="flex gap-3 ${isUser?'flex-row-reverse':''}"><div class="${isUser?'bg-gray-800 text-white':'bg-gray-100 text-gray-700'} p-3 rounded-lg text-sm shadow-sm">${text}</div></div>`;
            h.scrollTop=h.scrollHeight;
        }
        function sendAiMsg() {
            const v=document.getElementById('ai-input').value;if(!v)return;
            addAiMessage(v,true);document.getElementById('ai-input').value='';
            setTimeout(()=>addAiMessage('AI 思考中...'),1000);
        }
        function aiEvaluateGoal(){addAiMessage('评估完成。');}
        function aiReviewWBS(){addAiMessage('审查完成。');}
        function aiCheckProposal(){addAiMessage('预审通过。');}
        function aiDebug(){addAiMessage('粘贴报错信息...');}
        function aiPolishing(){addAiMessage('润色完成。');}
        function aiStartDefense(){addAiMessage('答辩开始。');}

        // Init
        async function init() {
            if (!projectId) { alert('未指定项目 ID'); window.location.href = 'workspace.html'; return; }
            if (!window.auth) return;
            await loadData();
            switchStage('inception');
        }
        
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
