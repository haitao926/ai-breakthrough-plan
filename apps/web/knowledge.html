<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全球创新知识库 | Knowledge Base</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.3); }
        
        .field-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .field-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }
        
        .category-pill { @apply px-3 py-1 rounded-full text-xs font-bold bg-gray-100 text-gray-500; }
        .category-pill.active { @apply bg-indigo-600 text-white; }
    </style>
</head>
<body class="text-gray-800">

    <!-- 导航栏 -->
    <nav class="fixed w-full z-50 bg-white/90 backdrop-blur-md border-b border-gray-200/50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <!-- Left: Logo -->
                <div class="flex items-center gap-3 shrink-0">
                    <a href="index.html" class="flex items-center gap-2 group">
                        <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold shadow-md group-hover:bg-indigo-700 transition">AI</div>
                        <span class="font-bold text-xl tracking-tight text-gray-900 group-hover:text-indigo-600 transition">破壁计划</span>
                    </a>
                </div>

                <!-- Center: Navigation Links (Stabilized) -->
                <div class="hidden md:flex items-center space-x-1">
                    <a href="knowledge.html" class="px-3 py-2 rounded-md text-sm font-medium bg-indigo-50 text-indigo-700 transition-all flex items-center">
                        <i class="fas fa-book-reader mr-2 text-xs"></i>创新知识库
                    </a>
                    <a href="competencies.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-all flex items-center">
                        <i class="fas fa-graduation-cap mr-2 text-xs"></i>学术指导
                    </a>
                    <a href="projects.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-all flex items-center">
                        <i class="fas fa-layer-group mr-2 text-xs"></i>项目库
                    </a>
                    <a href="downloads.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-all flex items-center">
                        <i class="fas fa-folder-open mr-2 text-xs"></i>课程资料库
                    </a>
                </div>

                <!-- Right: Workspace CTA -->
                <div class="flex gap-3 items-center shrink-0">
                    <a href="workspace.html" class="inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all transform hover:-translate-y-0.5">
                        <i class="fas fa-rocket mr-2"></i> 进入工作台
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <header class="pt-32 pb-16 bg-white border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
            <h1 class="text-4xl md:text-5xl font-extrabold text-gray-900 mb-6 tracking-tight">
                探索学术前沿，<br>
                <span class="text-transparent bg-clip-text bg-gradient-to-r from-indigo-600 to-purple-600">点亮创新火花</span>
            </h1>
            <p class="text-lg text-gray-500 max-w-2xl mx-auto leading-relaxed">
                这里汇集了顶尖学者推荐的 20+ 核心学科领域知识。无论你是想做科研、搞发明还是做公益，都能在这里找到理论支撑与灵感源泉。
            </p>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 space-y-24">

        <!-- Section 2: Academic Fields Library -->
        <section id="fields">
            <div class="flex flex-col md:flex-row md:items-center justify-between mb-10 gap-6">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center text-xl shadow-sm">
                        <i class="fas fa-university"></i>
                    </div>
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900">学科知识百科</h2>
                        <p class="text-sm text-gray-500 mt-1">20 大核心学科领域的入门指引与项目启发</p>
                    </div>
                </div>
                
                <!-- Filter Pills -->
                <div class="flex flex-wrap gap-2">
                    <button class="category-pill active" onclick="filterFields('all')">全部</button>
                    <button class="category-pill" onclick="filterFields('stem')">理工科 (STEM)</button>
                    <button class="category-pill" onclick="filterFields('social')">社科 (Social)</button>
                    <button class="category-pill" onclick="filterFields('humanities')">人文 (Humanities)</button>
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6" id="fields-grid">
                <!-- Fields injected by JS -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-12 mt-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-gray-500">
            <p>© 2025 HAI Tech Lab | Knowledge Base v1.0</p>
        </div>
    </footer>

    <!-- Field Detail Modal -->
    <div id="field-modal" class="fixed inset-0 z-[100] hidden">
        <!-- Backdrop -->
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm transition-opacity" onclick="closeModal()"></div>
        
        <!-- Panel -->
        <div class="absolute right-0 top-0 h-full w-full md:w-[600px] bg-white shadow-2xl transform transition-transform translate-x-full flex flex-col" id="modal-panel">
            
            <!-- Modal Header -->
            <div class="p-8 border-b border-gray-100 flex justify-between items-start bg-gray-50">
                <div>
                    <span class="inline-block px-3 py-1 rounded bg-indigo-100 text-indigo-700 text-xs font-bold mb-3" id="modal-category">CATEGORY</span>
                    <h2 class="text-3xl font-extrabold text-gray-900 leading-tight" id="modal-title">Field Name</h2>
                    <div class="text-gray-500 text-sm mt-1 font-mono" id="modal-en">Field Name EN</div>
                </div>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-700 transition rounded-full p-2 hover:bg-gray-200">
                    <i class="fas fa-times text-xl"></i>
                </button>
            </div>

            <!-- Modal Content (Scrollable) -->
            <div class="flex-1 overflow-y-auto p-8 space-y-10">
                
                <!-- 101 Section -->
                <div>
                    <h3 class="flex items-center gap-2 text-lg font-bold text-gray-900 mb-4">
                        <i class="fas fa-book-open text-indigo-500"></i> 学科 101
                    </h3>
                    <div class="prose prose-sm text-gray-600 leading-relaxed" id="modal-desc">
                        <!-- Description content -->
                    </div>
                </div>

                <!-- Inspiration Section -->
                <div class="bg-indigo-50 rounded-xl p-6 border border-indigo-100">
                    <h3 class="flex items-center gap-2 text-lg font-bold text-indigo-900 mb-4">
                        <i class="fas fa-lightbulb text-yellow-500"></i> 项目启发
                    </h3>
                    <div class="text-sm text-indigo-800 leading-relaxed" id="modal-inspiration">
                        <!-- Inspiration content -->
                    </div>
                    <div class="mt-6 pt-4 border-t border-indigo-200">
                        <a href="projects.html" class="text-xs font-bold text-indigo-600 hover:text-indigo-800 flex items-center">
                            查看该领域往届优秀作品 <i class="fas fa-arrow-right ml-1"></i>
                        </a>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        // --- Data: 20 Fields ---
        // Using "Tech & Engineering" as the full example, others as placeholders for now.
        const fieldsData = [
            { 
                id: 'tech', name: '科技与工程', en: 'Technology and Engineering', cat: 'stem', icon: 'fa-microchip', color: 'blue',
                desc: '科技，对于伴随智能手机和平板电脑长大的我们，再也不是一件遥远和冰冷的事情。它带给我们便利、欢乐、更多的机会和无限的可能。不管我们学习文科或理科，以后从事什么行业，生活在城市或乡村，都很难生活在没有科技的世界。而工程和技术相辅相成，一同让科学脱离纸面，触手可及。',
                inspiration: '观看来自领域专家关于该学术领域相关知识和发展现状分享，并了解往届优秀项目，分别从学术研究和创新行动方向进行深度解析。'
            },
            { id: 'math', name: '应用数学', en: 'Applied Mathematics', cat: 'stem', icon: 'fa-calculator', color: 'indigo', desc: '数学不仅是符号与公式，它是描述宇宙规律的语言。应用数学关注如何用数学模型解决现实世界中的复杂问题，从金融风控到传染病预测。', inspiration: '探索如何用数学建模重新定义城市交通，或用统计算法优化资源分配。' },
            { id: 'cs', name: '计算机科学', en: 'Computer Science', cat: 'stem', icon: 'fa-laptop-code', color: 'blue', desc: '从算法到底层架构，计算机科学是数字时代的基石。它不仅关乎代码，更关乎逻辑思维与解决问题的能力。', inspiration: '研究人工智能伦理，或开发一款辅助视障人士的交互应用。' },
            { id: 'physics', name: '物理与化学', en: 'Physics & Chemistry', cat: 'stem', icon: 'fa-atom', color: 'purple', desc: '探索物质的本质与能量的转化。从微观粒子到宏观宇宙，理化科学为技术创新提供了最底层的理论支持。', inspiration: '研究新型环保材料，或探索家庭常见液体的物理特性。' },
            { id: 'env', name: '环境科学', en: 'Environmental Science', cat: 'stem', icon: 'fa-leaf', color: 'green', desc: '关注地球的可持续未来。研究气候变化、生态保护与资源利用，寻找人类与自然和谐共处之道。', inspiration: '调查校园碳足迹，或设计一套社区垃圾分类激励系统。' },
            { id: 'bio', name: '生命科学', en: 'Life Sciences', cat: 'stem', icon: 'fa-dna', color: 'red', desc: '解密生命的奥义。从基因编辑到神经科学，生命科学正在以前所未有的速度重塑我们对健康的认知。', inspiration: '研究睡眠习惯对青少年记忆力的影响，或调查入侵物种对本地生态的威胁。' },
            { id: 'astro', name: '天文地理', en: 'Astronomy & Geography', cat: 'stem', icon: 'fa-globe-americas', color: 'blue', desc: '仰望星空，脚踏实地。研究宇宙的起源与地球的演变，理解我们在时空中的位置。', inspiration: '利用卫星数据分析城市光污染，或研究家乡河流的变迁历史。' },
            { id: 'med', name: '医学', en: 'Medicine', cat: 'stem', icon: 'fa-heartbeat', color: 'red', desc: '治愈与关怀的科学。不仅关注疾病的治疗，更关注预防医学、医疗公平与健康体系的优化。', inspiration: '设计针对老年人的急救科普方案，或研究青少年近视的预防干预。' },
            
            { id: 'soc', name: '社会学与人类学', en: 'Sociology & Anthropology', cat: 'social', icon: 'fa-users', color: 'orange', desc: '理解人类社会的结构与文化。观察群体行为、社会关系与文化习俗，反思我们习以为常的生活方式。', inspiration: '记录正在消失的方言文化，或研究社交媒体对青少年自我认同的影响。' },
            { id: 'econ', name: '经济学', en: 'Economics', cat: 'social', icon: 'fa-chart-line', color: 'emerald', desc: '研究资源配置与决策选择。从微观的市场行为到宏观的国家政策，经济学提供了理性分析世界的视角。', inspiration: '调查“盲盒经济”背后的消费心理，或分析校园二手市场的定价机制。' },
            { id: 'psych', name: '心理学', en: 'Psychology', cat: 'social', icon: 'fa-brain', color: 'pink', desc: '探索人类的心智与行为。研究认知、情绪、人格与人际关系，帮助我们更好地理解自己与他人。', inspiration: '研究颜色对学习效率的影响，或探索同伴压力下的决策机制。' },
            { id: 'edu', name: '教育学', en: 'Education', cat: 'social', icon: 'fa-chalkboard-teacher', color: 'yellow', desc: '关注人的成长与学习。研究教育公平、教学法创新与终身学习，探索如何更好地赋能未来一代。', inspiration: '设计一门跨学科的PBL课程，或研究游戏化机制在学习中的应用。' },
            { id: 'public_health', name: '公共健康', en: 'Public Health', cat: 'social', icon: 'fa-hospital-user', color: 'teal', desc: '关注群体的健康福祉。研究流行病防控、健康政策与社区卫生，致力于构建更健康的社会环境。', inspiration: '评估学校食堂的营养均衡度，或推广心理健康急救知识。' },
            { id: 'comm', name: '传播和媒体', en: 'Media & Communication', cat: 'social', icon: 'fa-broadcast', color: 'cyan', desc: '研究信息的传递与影响。在数字时代，理解媒介如何塑造舆论、构建现实变得尤为重要。', inspiration: '分析短视频算法对信息茧房的构建，或策划一场校园反霸凌的传播战役。' },
            
            { id: 'arch', name: '建筑与城市', en: 'Architecture & Urban Studies', cat: 'humanities', icon: 'fa-city', color: 'stone', desc: '塑造我们居住的空间。研究建筑设计、城市规划与空间正义，探索如何让城市更宜居、更包容。', inspiration: '改造校园中的消极空间，或为老旧社区设计无障碍设施。' },
            { id: 'art', name: '艺术', en: 'Arts', cat: 'humanities', icon: 'fa-palette', color: 'rose', desc: '表达人类的情感与想象。无论是视觉艺术、表演还是设计，艺术都是连接心灵、反思社会的桥梁。', inspiration: '用装置艺术表达环保理念，或通过戏剧工作坊探索校园欺凌议题。' },
            { id: 'culture', name: '跨文化研究', en: 'Cross-Cultural Studies', cat: 'humanities', icon: 'fa-comments', color: 'fuchsia', desc: '搭建沟通的桥梁。在全球化背景下，研究不同文化间的冲突、融合与对话，培养全球胜任力。', inspiration: '比较中美青少年对“成功”定义的差异，或研究留学生的文化适应过程。' },
            { id: 'lang', name: '语言学', en: 'Linguistics', cat: 'humanities', icon: 'fa-language', color: 'violet', desc: '解码人类沟通的密码。研究语言的结构、演变与社会功能，探索语言如何影响思维。', inspiration: '分析网络流行语的构词规律，或研究双语环境对儿童认知发展的影响。' },
            { id: 'lit', name: '文学', en: 'Literature', cat: 'humanities', icon: 'fa-feather-alt', color: 'amber', desc: '阅读人类的精神历史。通过文本细读与批评，洞察不同时代、不同文化下的人性光辉与困境。', inspiration: '改编经典文学作品为现代剧本，或研究科幻小说中的未来伦理观。' },
            { id: 'sport', name: '体育和运动', en: 'Sports', cat: 'humanities', icon: 'fa-running', color: 'orange', desc: '探索身体的潜能与竞技精神。研究运动科学、体育产业与体育文化，理解体育如何凝聚社会。', inspiration: '分析电子竞技的产业生态，或设计一套针对久坐学生的体能恢复方案。' }
        ];

        // --- Render Logic ---
        const grid = document.getElementById('fields-grid');

        function renderFields(filter = 'all') {
            grid.innerHTML = '';
            
            // Update Filter UI
            document.querySelectorAll('.category-pill').forEach(btn => {
                if (btn.innerText.includes('全部') && filter === 'all') btn.classList.add('active');
                else if (btn.innerText.includes('STEM') && filter === 'stem') btn.classList.add('active');
                else if (btn.innerText.includes('社科') && filter === 'social') btn.classList.add('active');
                else if (btn.innerText.includes('人文') && filter === 'humanities') btn.classList.add('active');
                else btn.classList.remove('active');
            });

            fieldsData.forEach(f => {
                if (filter !== 'all' && f.cat !== filter) return;

                const card = document.createElement('div');
                card.className = 'field-card bg-white rounded-xl p-6 border border-gray-100 cursor-pointer flex flex-col items-center text-center group';
                card.onclick = () => openFieldModal(f);
                
                card.innerHTML = `
                    <div class="w-14 h-14 rounded-full bg-${f.color}-50 text-${f.color}-600 flex items-center justify-center text-2xl mb-4 group-hover:scale-110 transition duration-300">
                        <i class="fas ${f.icon}"></i>
                    </div>
                    <h3 class="font-bold text-gray-900 text-lg mb-1">${f.name}</h3>
                    <p class="text-xs text-gray-400 font-medium uppercase tracking-wider mb-3">${f.en}</p>
                    <span class="text-xs text-indigo-600 font-bold opacity-0 group-hover:opacity-100 transition translate-y-2 group-hover:translate-y-0">
                        点击查看详情 <i class="fas fa-arrow-right ml-1"></i>
                    </span>
                `;
                grid.appendChild(card);
            });
        }

        // --- Modal Logic ---
        function openFieldModal(field) {
            const modal = document.getElementById('field-modal');
            const panel = document.getElementById('modal-panel');
            
            // Populate Data
            document.getElementById('modal-category').innerText = field.cat.toUpperCase();
            document.getElementById('modal-title').innerText = field.name;
            document.getElementById('modal-en').innerText = field.en;
            document.getElementById('modal-desc').innerText = field.desc || '暂无详细介绍。';
            document.getElementById('modal-inspiration').innerText = field.inspiration || '暂无项目启发。';

            // Show
            modal.classList.remove('hidden');
            setTimeout(() => {
                panel.classList.remove('translate-x-full');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('field-modal');
            const panel = document.getElementById('modal-panel');
            
            panel.classList.add('translate-x-full');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            renderFields('all');
        });

    </script>
</body>
</html>
