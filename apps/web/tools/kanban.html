<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>敏捷看板 | Agile Kanban</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: #eef2f6; }
        
        .column { min-width: 280px; }
        .task-card {
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: grab;
        }
        .task-card:active { cursor: grabbing; transform: rotate(1deg); }
        .drag-over { background-color: rgba(226, 232, 240, 0.8); border: 2px dashed #94a3b8; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- 顶部导航 -->
    <nav class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center shrink-0 z-10">
        <div class="flex items-center gap-3">
            <a href="../tools.html" class="text-gray-400 hover:text-gray-600 transition"><i class="fas fa-arrow-left"></i></a>
            <h1 class="font-bold text-gray-800 text-lg flex items-center">
                <i class="fas fa-tasks text-blue-600 mr-2"></i> 敏捷看板
            </h1>
        </div>
        <div class="flex items-center gap-4">
            <div class="text-xs text-gray-500 bg-gray-100 px-3 py-1 rounded-full">
                <i class="far fa-clock mr-1"></i> Sprint 1
            </div>
            <button onclick="addTask()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-sm font-bold shadow-sm transition">
                <i class="fas fa-plus mr-1"></i> 新建任务
            </button>
        </div>
    </nav>

    <!-- 看板主体 -->
    <main class="flex-1 overflow-x-auto overflow-y-hidden p-6">
        <div class="flex h-full gap-6">
            
            <!-- 待办 (To Do) -->
            <div class="column flex-1 max-w-sm flex flex-col bg-gray-100 rounded-xl border border-gray-200/60 shadow-sm"
                 ondrop="drop(event, 'todo')" ondragover="allowDrop(event)" ondragleave="leaveDrop(event)">
                <div class="p-3 border-b border-gray-200/50 flex justify-between items-center">
                    <span class="font-bold text-gray-600 text-sm"><i class="far fa-circle mr-2"></i>待办 (To Do)</span>
                    <span class="bg-white text-gray-500 text-xs px-2 py-0.5 rounded-full border border-gray-200" id="count-todo">0</span>
                </div>
                <div class="flex-1 overflow-y-auto p-3 space-y-3" id="col-todo">
                    <!-- Tasks -->
                </div>
            </div>

            <!-- 进行中 (Doing) -->
            <div class="column flex-1 max-w-sm flex flex-col bg-blue-50/50 rounded-xl border border-blue-100 shadow-sm"
                 ondrop="drop(event, 'doing')" ondragover="allowDrop(event)" ondragleave="leaveDrop(event)">
                <div class="p-3 border-b border-blue-100 flex justify-between items-center">
                    <span class="font-bold text-blue-700 text-sm"><i class="fas fa-spinner fa-spin mr-2"></i>进行中 (Doing)</span>
                    <span class="bg-white text-blue-600 text-xs px-2 py-0.5 rounded-full border border-blue-100" id="count-doing">0</span>
                </div>
                <div class="flex-1 overflow-y-auto p-3 space-y-3" id="col-doing">
                </div>
            </div>

            <!-- 待验收 (Review) -->
            <div class="column flex-1 max-w-sm flex flex-col bg-yellow-50/50 rounded-xl border border-yellow-100 shadow-sm"
                 ondrop="drop(event, 'review')" ondragover="allowDrop(event)" ondragleave="leaveDrop(event)">
                <div class="p-3 border-b border-yellow-100 flex justify-between items-center">
                    <span class="font-bold text-yellow-700 text-sm"><i class="fas fa-microscope mr-2"></i>待验收 (Review)</span>
                    <span class="bg-white text-yellow-600 text-xs px-2 py-0.5 rounded-full border border-yellow-100" id="count-review">0</span>
                </div>
                <div class="flex-1 overflow-y-auto p-3 space-y-3" id="col-review">
                </div>
            </div>

            <!-- 已完成 (Done) -->
            <div class="column flex-1 max-w-sm flex flex-col bg-green-50/50 rounded-xl border border-green-100 shadow-sm"
                 ondrop="drop(event, 'done')" ondragover="allowDrop(event)" ondragleave="leaveDrop(event)">
                <div class="p-3 border-b border-green-100 flex justify-between items-center">
                    <span class="font-bold text-green-700 text-sm"><i class="fas fa-check-circle mr-2"></i>已完成 (Done)</span>
                    <span class="bg-white text-green-600 text-xs px-2 py-0.5 rounded-full border border-green-100" id="count-done">0</span>
                </div>
                <div class="flex-1 overflow-y-auto p-3 space-y-3" id="col-done">
                </div>
            </div>

        </div>
    </main>

    <script>
        // 数据逻辑
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('project');
        const DATA_KEY = projectId ? `ai_course_kanban_${projectId}` : 'ai_course_kanban';
        let tasks = JSON.parse(localStorage.getItem(DATA_KEY) || '[]');

        if(tasks.length === 0) {
            // Demo data
            tasks = [
                { id: 't1', title: '注册 GitHub 账号', status: 'done', tag: '基础' },
                { id: 't2', title: '完成项目立项书', status: 'doing', tag: '文档' },
                { id: 't3', title: '搭建开发环境', status: 'todo', tag: '开发' }
            ];
            save();
        }

        function save() {
            localStorage.setItem(DATA_KEY, JSON.stringify(tasks));
            render();
        }

        function render() {
            // Clear
            ['todo', 'doing', 'review', 'done'].forEach(s => {
                document.getElementById(`col-${s}`).innerHTML = '';
            });

            // Fill
            tasks.forEach(task => {
                const el = createCard(task);
                document.getElementById(`col-${task.status}`).appendChild(el);
            });

            // Count
            ['todo', 'doing', 'review', 'done'].forEach(s => {
                const count = tasks.filter(t => t.status === s).length;
                document.getElementById(`count-${s}`).textContent = count;
            });
        }

        function createCard(task) {
            const div = document.createElement('div');
            div.className = "task-card bg-white p-4 rounded-lg border border-gray-200 shadow-sm hover:shadow-md group";
            div.draggable = true;
            div.id = task.id;
            div.ondragstart = drag;
            
            // Tag color
            const tagColors = { '基础': 'bg-gray-100 text-gray-600', '文档': 'bg-purple-100 text-purple-600', '开发': 'bg-blue-100 text-blue-600' };
            const tagClass = tagColors[task.tag] || 'bg-gray-100 text-gray-500';

            div.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <span class="text-[10px] font-bold ${tagClass} px-2 py-0.5 rounded">${task.tag || '任务'}</span>
                    <button onclick="deleteTask('${task.id}')" class="text-gray-300 hover:text-red-400 opacity-0 group-hover:opacity-100 transition"><i class="fas fa-times"></i></button>
                </div>
                <p class="text-sm font-medium text-gray-800 leading-snug">${task.title}</p>
            `;
            return div;
        }

        function addTask() {
            const title = prompt("请输入任务内容:");
            if(title) {
                tasks.push({
                    id: 't-' + Date.now(),
                    title: title,
                    status: 'todo',
                    tag: '新任务'
                });
                save();
            }
        }

        function deleteTask(id) {
            if(confirm("删除此任务？")) {
                tasks = tasks.filter(t => t.id !== id);
                save();
            }
        }

        // Drag & Drop
        function allowDrop(ev) {
            ev.preventDefault();
            ev.currentTarget.classList.add('drag-over');
        }
        
        function leaveDrop(ev) {
            ev.currentTarget.classList.remove('drag-over');
        }

        function drag(ev) {
            ev.dataTransfer.setData("text", ev.target.id);
        }

        function drop(ev, targetStatus) {
            ev.preventDefault();
            ev.currentTarget.classList.remove('drag-over');
            const taskId = ev.dataTransfer.getData("text");
            const task = tasks.find(t => t.id === taskId);
            if(task && task.status !== targetStatus) {
                task.status = targetStatus;
                save();
            }
        }

        // Init
        render();
    </script>
</body>
</html>
