<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目立项书 | Project Charter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .input-group:focus-within label { color: #4f46e5; }
        .input-group:focus-within i { color: #4f46e5; }
        .mode-btn.active { background-color: #e0e7ff; color: #4f46e5; border-color: #4f46e5; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 顶部导航 -->
    <nav class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <a href="../tools.html" class="text-gray-400 hover:text-gray-600 transition"><i class="fas fa-arrow-left"></i></a>
            <h1 class="font-bold text-gray-800 text-lg flex items-center">
                <i class="fas fa-file-signature text-purple-600 mr-2"></i> 项目立项书
            </h1>
            <a href="../competencies.html" target="_blank" class="ml-2 text-xs bg-indigo-50 text-indigo-600 px-2 py-1 rounded-full border border-indigo-100 hover:bg-indigo-100 transition">
                <i class="fas fa-question-circle mr-1"></i> 类型指南
            </a>
        </div>
        
        <!-- Mode Toggle -->
        <div class="flex bg-gray-100 p-1 rounded-lg">
            <button onclick="setMode('product')" id="btn-product" class="mode-btn px-3 py-1 text-xs rounded-md text-gray-500 border border-transparent transition">工程产品</button>
            <button onclick="setMode('research')" id="btn-research" class="mode-btn px-3 py-1 text-xs rounded-md text-gray-500 border border-transparent transition">课题探究</button>
            <button onclick="setMode('impact')" id="btn-impact" class="mode-btn px-3 py-1 text-xs rounded-md text-gray-500 border border-transparent transition">社会公益</button>
        </div>

        <div class="flex items-center gap-3">
            <span id="saveStatus" class="text-xs text-gray-400">自动保存中...</span>
            <button onclick="exportPDF()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3 py-1.5 rounded-lg text-sm transition">
                <i class="fas fa-file-pdf mr-1"></i> 导出 PDF
            </button>
        </div>
    </nav>

    <!-- 主画布 -->
    <main class="flex-1 max-w-5xl mx-auto w-full p-8">
        
        <!-- 头部信息 -->
        <div class="mb-8 text-center">
            <input type="text" id="projName" class="text-4xl font-extrabold text-center bg-transparent border-b-2 border-transparent hover:border-gray-200 focus:border-purple-500 outline-none w-full py-2 transition placeholder-gray-300" placeholder="在此输入项目名称...">
            <p class="text-gray-400 mt-2 text-sm">定义你的愿景，明确你的方向</p>
        </div>

        <!-- 核心四问矩阵 -->
        <div class="grid md:grid-cols-2 gap-6">
            
            <!-- 1. 用户 / 研究对象 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 input-group hover:shadow-md transition duration-300">
                <label id="lbl-q1" class="block text-xs font-bold text-gray-500 uppercase mb-3 flex items-center transition-colors">
                    <i class="fas fa-user-circle mr-2 text-lg"></i> 1. 目标用户 (Who)
                </label>
                <textarea id="projPersona" class="w-full h-32 text-base resize-none outline-none text-gray-700 bg-transparent placeholder-gray-300 leading-relaxed" placeholder="Loading..."></textarea>
            </div>

            <!-- 2. 痛点 / 探究问题 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 input-group hover:shadow-md transition duration-300">
                <label id="lbl-q2" class="block text-xs font-bold text-gray-500 uppercase mb-3 flex items-center transition-colors">
                    <i class="fas fa-exclamation-triangle mr-2 text-lg"></i> 2. 核心痛点 (Why)
                </label>
                <textarea id="projPain" class="w-full h-32 text-base resize-none outline-none text-gray-700 bg-transparent placeholder-gray-300 leading-relaxed" placeholder="Loading..."></textarea>
            </div>

            <!-- 3. 方案 / 研究方法 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 input-group hover:shadow-md transition duration-300">
                <label id="lbl-q3" class="block text-xs font-bold text-gray-500 uppercase mb-3 flex items-center transition-colors">
                    <i class="fas fa-lightbulb mr-2 text-lg"></i> 3. 解决方案 (How)
                </label>
                <textarea id="projSolution" class="w-full h-32 text-base resize-none outline-none text-gray-700 bg-transparent placeholder-gray-300 leading-relaxed" placeholder="Loading..."></textarea>
            </div>

            <!-- 4. 价值 / 预期成果 -->
            <div class="bg-gradient-to-br from-purple-600 to-indigo-700 p-6 rounded-2xl shadow-lg text-white">
                <label id="lbl-q4" class="block text-xs font-bold text-purple-200 uppercase mb-3 flex items-center">
                    <i class="fas fa-bullhorn mr-2 text-lg"></i> 4. 电梯演讲 (Value)
                </label>
                <textarea id="projValue" class="w-full h-32 text-lg font-medium resize-none outline-none text-white bg-transparent placeholder-purple-300/50 leading-relaxed" placeholder="Loading..."></textarea>
            </div>

        </div>

    </main>

    <script>
        // Data & State
        const fields = ['projName', 'projPersona', 'projPain', 'projSolution', 'projValue'];
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('project');
        const DATA_KEY = projectId ? `ai_course_charter_${projectId}` : 'ai_course_charter';
        
        let currentMode = 'product'; // 'product', 'research', or 'impact'

        // Configurations
        const CONFIG = {
            product: {
                q1: { label: '<i class="fas fa-user-circle mr-2 text-lg"></i> 1. 目标用户 (Who)', ph: '描述你的典型用户画像。\n例如：高一（3）班经常忘记带饭卡的走读生...' },
                q2: { label: '<i class="fas fa-exclamation-triangle mr-2 text-lg"></i> 2. 核心痛点 (Why)', ph: '他们遇到了什么麻烦？\n例如：午休时间只有40分钟，排队充卡要花15分钟...' },
                q3: { label: '<i class="fas fa-lightbulb mr-2 text-lg"></i> 3. 解决方案 (How)', ph: '我们要开发什么？\n例如：基于人脸识别的无感支付终端，部署在食堂窗口...' },
                q4: { label: '<i class="fas fa-bullhorn mr-2 text-lg"></i> 4. 电梯演讲 (Value)', ph: '一句话打动评委：\n我们的产品是______，为了解决______问题，它能够______。' }
            },
            research: {
                q1: { label: '<i class="fas fa-microscope mr-2 text-lg"></i> 1. 研究对象 (Object)', ph: '你的研究主体是什么？\n例如：校园内不同光照条件下的植物生长情况...' },
                q2: { label: '<i class="fas fa-question-circle mr-2 text-lg"></i> 2. 探究问题 (Question)', ph: '你想解决什么科学问题或验证什么假设？\n例如：红光照射是否比蓝光更能促进多肉植物生长？' },
                q3: { label: '<i class="fas fa-vial mr-2 text-lg"></i> 3. 研究方法 (Method)', ph: '你打算怎么做实验？\n例如：设置对照组，控制变量（光照强度、水分），每日记录...' },
                q4: { label: '<i class="fas fa-clipboard-check mr-2 text-lg"></i> 4. 预期成果 (Outcome)', ph: '你希望得到什么结论或产出？\n例如：一份关于光照对植物生长影响的实验报告和数据图表。' }
            },
            impact: {
                q1: { label: '<i class="fas fa-hands-helping mr-2 text-lg"></i> 1. 受益群体 (Beneficiary)', ph: '谁会因为你的行动而受益？\n例如：社区里的空巢老人，子女长期在外工作...' },
                q2: { label: '<i class="fas fa-heart-broken mr-2 text-lg"></i> 2. 社会议题 (Issue)', ph: '你关注的社会问题是什么？\n例如：老年人缺乏陪伴，且难以适应数字化生活（买菜、就医困难）...' },
                q3: { label: '<i class="fas fa-hand-holding-heart mr-2 text-lg"></i> 3. 行动方案 (Action)', ph: '你打算做什么具体的行动？\n例如：组织每周一次的“数字反哺”志愿服务，一对一教老人使用智能手机...' },
                q4: { label: '<i class="fas fa-star mr-2 text-lg"></i> 4. 社会影响 (Impact)', ph: '你希望带来什么样的改变？\n例如：帮助30位老人掌握微信使用，建立社区互助网络，提升幸福感。' }
            }
        };

        // Load
        const saved = JSON.parse(localStorage.getItem(DATA_KEY) || '{}');
        fields.forEach(f => {
            if(saved[f]) document.getElementById(f).value = saved[f];
        });
        
        // Restore Mode
        if (saved.mode && CONFIG[saved.mode]) {
            setMode(saved.mode);
        } else {
            setMode('product');
        }

        // Functions
        function setMode(mode) {
            currentMode = mode;
            
            // UI Toggle
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');

            // Labels & Placeholders
            const c = CONFIG[mode];
            document.getElementById('lbl-q1').innerHTML = c.q1.label;
            document.getElementById('projPersona').placeholder = c.q1.ph;
            
            document.getElementById('lbl-q2').innerHTML = c.q2.label;
            document.getElementById('projPain').placeholder = c.q2.ph;
            
            document.getElementById('lbl-q3').innerHTML = c.q3.label;
            document.getElementById('projSolution').placeholder = c.q3.ph;
            
            document.getElementById('lbl-q4').innerHTML = c.q4.label;
            document.getElementById('projValue').placeholder = c.q4.ph;

            saveData();
        }

        function saveData() {
            const data = { mode: currentMode };
            fields.forEach(f => data[f] = document.getElementById(f).value);
            localStorage.setItem(DATA_KEY, JSON.stringify(data));
            
            const status = document.getElementById('saveStatus');
            status.textContent = '已保存';
            status.classList.add('text-green-500');
            setTimeout(() => {
                status.textContent = '自动保存中...';
                status.classList.remove('text-green-500');
            }, 1000);
        }

        // Auto Save Listener
        document.body.addEventListener('input', saveData);

        function exportPDF() {
            window.print();
        }
    </script>
</body>
</html>
