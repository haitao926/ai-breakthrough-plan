<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文献阅读 | Literature Review</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .input-group:focus-within label { color: #4f46e5; }
        .input-group:focus-within i { color: #4f46e5; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- 顶部导航 -->
    <nav class="bg-white border-b border-gray-200 px-6 py-3 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <a href="../tools.html" class="text-gray-400 hover:text-gray-600 transition"><i class="fas fa-arrow-left"></i></a>
            <h1 class="font-bold text-gray-800 text-lg flex items-center">
                <i class="fas fa-book text-indigo-600 mr-2"></i> 文献阅读
            </h1>
        </div>
        <div class="flex items-center gap-3">
            <span id="saveStatus" class="text-xs text-gray-400">自动保存中...</span>
        </div>
    </nav>

    <!-- 主体 -->
    <main class="flex-1 max-w-5xl mx-auto w-full p-8">
        <div class="mb-8 text-center">
            <h2 class="text-3xl font-bold text-gray-900 mb-2">先读文献，再定方向</h2>
            <p class="text-gray-500 text-sm">整理已有研究与关键结论，为项目立项提供证据。</p>
        </div>

        <div class="grid md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 input-group">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-3 flex items-center">
                    <i class="fas fa-bullseye mr-2 text-lg"></i> 研究主题 / 问题
                </label>
                <input id="topic" class="w-full text-base outline-none text-gray-700 bg-transparent placeholder-gray-300" placeholder="你要解决的问题是什么？">
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 input-group">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-3 flex items-center">
                    <i class="fas fa-search mr-2 text-lg"></i> 检索关键词
                </label>
                <textarea id="keywords" class="w-full h-24 text-base resize-none outline-none text-gray-700 bg-transparent placeholder-gray-300" placeholder="关键词 1、关键词 2、关键词 3..."></textarea>
            </div>
        </div>

        <div class="mt-6 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <div class="flex items-center justify-between mb-4">
                <div>
                    <h3 class="text-lg font-bold text-gray-900">文献清单</h3>
                    <p class="text-xs text-gray-400 mt-1">记录阅读过的核心论文与关键结论。</p>
                </div>
                <button onclick="addPaper()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm font-bold hover:bg-indigo-700 transition">
                    <i class="fas fa-plus mr-1"></i> 添加文献
                </button>
            </div>
            <div id="paper-list" class="space-y-4"></div>
        </div>

        <div class="mt-6 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 input-group">
            <label class="block text-xs font-bold text-gray-500 uppercase mb-3 flex items-center">
                <i class="fas fa-lightbulb mr-2 text-lg"></i> 阅读笔记 / 关键启发
            </label>
            <textarea id="notes" class="w-full h-32 text-base resize-none outline-none text-gray-700 bg-transparent placeholder-gray-300" placeholder="总结最重要的发现：已有研究做了什么、你还可以补充什么？"></textarea>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('project');
        const DATA_KEY = projectId ? `ai_course_literature_${projectId}` : 'ai_course_literature';

        let state = {
            topic: '',
            keywords: '',
            notes: '',
            papers: []
        };

        const statusEl = document.getElementById('saveStatus');
        let statusTimer = null;

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function loadData() {
            const saved = JSON.parse(localStorage.getItem(DATA_KEY) || '{}');
            state.topic = saved.topic || '';
            state.keywords = saved.keywords || '';
            state.notes = saved.notes || '';
            state.papers = Array.isArray(saved.papers) ? saved.papers : [];

            document.getElementById('topic').value = state.topic;
            document.getElementById('keywords').value = state.keywords;
            document.getElementById('notes').value = state.notes;
        }

        function saveData() {
            localStorage.setItem(DATA_KEY, JSON.stringify(state));
            if (!statusEl) return;
            statusEl.textContent = '已保存';
            statusEl.classList.add('text-green-500');
            clearTimeout(statusTimer);
            statusTimer = setTimeout(() => {
                statusEl.textContent = '自动保存中...';
                statusEl.classList.remove('text-green-500');
            }, 1000);
        }

        function renderPapers() {
            const list = document.getElementById('paper-list');
            if (!state.papers.length) {
                list.innerHTML = '<div class="text-sm text-gray-400">还没有文献，点击“添加文献”。</div>';
                return;
            }
            list.innerHTML = state.papers.map((paper, idx) => {
                return `
                    <div class="border border-gray-200 rounded-xl p-4 bg-gray-50">
                        <div class="flex items-center justify-between mb-3">
                            <div class="text-sm font-bold text-gray-700">文献 ${idx + 1}</div>
                            <button onclick="removePaper(${idx})" class="text-xs text-gray-400 hover:text-red-500">
                                <i class="fas fa-trash-alt mr-1"></i>移除
                            </button>
                        </div>
                        <div class="grid md:grid-cols-2 gap-3">
                            <input class="w-full px-3 py-2 rounded-lg border border-gray-200 text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="论文标题" value="${escapeHtml(paper.title)}" oninput="updatePaper(${idx}, 'title', this.value)">
                            <input class="w-full px-3 py-2 rounded-lg border border-gray-200 text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="作者 / 年份" value="${escapeHtml(paper.authors)}" oninput="updatePaper(${idx}, 'authors', this.value)">
                        </div>
                        <input class="w-full mt-3 px-3 py-2 rounded-lg border border-gray-200 text-sm outline-none focus:ring-2 focus:ring-indigo-500" placeholder="链接 / DOI" value="${escapeHtml(paper.link)}" oninput="updatePaper(${idx}, 'link', this.value)">
                        <textarea class="w-full mt-3 px-3 py-2 rounded-lg border border-gray-200 text-sm outline-none focus:ring-2 focus:ring-indigo-500 resize-none" rows="3" placeholder="核心结论 / 可借鉴点" oninput="updatePaper(${idx}, 'takeaway', this.value)">${escapeHtml(paper.takeaway)}</textarea>
                    </div>
                `;
            }).join('');
        }

        function addPaper() {
            state.papers.push({ title: '', authors: '', link: '', takeaway: '' });
            renderPapers();
            saveData();
        }

        function removePaper(idx) {
            state.papers.splice(idx, 1);
            renderPapers();
            saveData();
        }

        function updatePaper(idx, field, value) {
            if (!state.papers[idx]) return;
            state.papers[idx][field] = value;
            saveData();
        }

        document.getElementById('topic').addEventListener('input', (e) => {
            state.topic = e.target.value;
            saveData();
        });
        document.getElementById('keywords').addEventListener('input', (e) => {
            state.keywords = e.target.value;
            saveData();
        });
        document.getElementById('notes').addEventListener('input', (e) => {
            state.notes = e.target.value;
            saveData();
        });

        loadData();
        renderPapers();
    </script>
</body>
</html>
