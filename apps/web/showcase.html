<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教学展示墙 | HAI Tech Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="js/auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .project-card {
            transition: all 0.3s ease;
        }
        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.1);
        }
        
        .project-image {
            height: 200px;
            background-color: #f3f4f6;
            overflow: hidden;
            position: relative;
        }
        .project-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .project-card:hover .project-image img {
            transform: scale(1.05);
        }

        .tag {
            font-size: 0.75rem;
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- 导航栏 -->
    <nav class="fixed w-full z-50 glass transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <a href="index.html" class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold shadow-md">AI</div>
                    <span class="font-bold text-xl tracking-tight text-gray-900">破壁计划</span>
                </a>
                <div class="hidden md:flex space-x-8">
                    <a href="index.html" class="text-gray-600 hover:text-indigo-600 font-medium transition">首页</a>
                    <a href="competencies.html" class="text-gray-600 hover:text-indigo-600 font-medium transition">核心素养</a>
                    <a href="showcase.html" class="text-indigo-600 font-medium transition">教学展示墙</a>
                    <a href="downloads.html" class="text-gray-600 hover:text-indigo-600 font-medium transition">资源与工具</a>
                </div>
                <div class="flex gap-3 items-center">
                    <a href="workspace.html" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg transition text-sm font-bold shadow-md flex items-center">
                        <i class="fas fa-rocket mr-2"></i> 进入工坊
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <header class="bg-white pt-32 pb-12 border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <h1 class="text-4xl font-extrabold text-gray-900 mb-4">
                教学成果展示墙
            </h1>
            <p class="text-lg text-gray-500 max-w-3xl">
                这里展示了同学们的精彩创意和实战成果。每一个项目都是从 0 到 1 的突破。
            </p>
            
            <!-- Filter Tabs -->
            <div class="mt-8 flex gap-2 overflow-x-auto pb-2" id="filter-container">
                <button onclick="filterProjects('all')" class="filter-btn active px-4 py-2 bg-gray-900 text-white rounded-lg text-sm font-medium whitespace-nowrap transition" data-filter="all">全部作品</button>
                <button onclick="filterProjects('project1')" class="filter-btn px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-50 whitespace-nowrap transition" data-filter="project1">💻 Vibe Coding</button>
                <button onclick="filterProjects('project2')" class="filter-btn px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-50 whitespace-nowrap transition" data-filter="project2">📱 产品设计</button>
                <button onclick="filterProjects('project3')" class="filter-btn px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-50 whitespace-nowrap transition" data-filter="project3">💻 全栈应用</button>
                <button onclick="filterProjects('project4')" class="filter-btn px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-50 whitespace-nowrap transition" data-filter="project4">🤖 AI 模型</button>
                <button onclick="filterProjects('project5')" class="filter-btn px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-50 whitespace-nowrap transition" data-filter="project5">🔌 智能硬件</button>
                <button onclick="filterProjects('project6')" class="filter-btn px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-50 whitespace-nowrap transition" data-filter="project6">🚀 综合实战</button>
                <button onclick="filterProjects('common')" class="filter-btn px-4 py-2 bg-white border border-gray-200 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-50 whitespace-nowrap transition" data-filter="common">📂 其他/历史</button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8" id="showcase-grid">
            <!-- Loading State -->
            <div class="col-span-full text-center py-20 text-gray-400">
                <i class="fas fa-spinner fa-spin text-4xl mb-4"></i>
                <p>正在加载精彩作品...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-gray-500 text-sm">
            <p>© 2025 HAI Tech Lab | 教学成果展示</p>
        </div>
    </footer>

    <!-- Image Modal -->
    <div id="image-modal" class="fixed inset-0 bg-black/90 z-[100] hidden flex items-center justify-center p-4" onclick="closeModal()">
        <img id="modal-img" src="" class="max-w-full max-h-full rounded shadow-2xl">
        <button class="absolute top-4 right-4 text-white hover:text-gray-300 text-4xl" onclick="closeModal()">&times;</button>
    </div>

    <!-- Submit Modal -->
    <div id="submit-modal" class="fixed inset-0 bg-black/50 z-[100] hidden flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-md p-6 transform transition-all scale-100">
            <h3 class="text-xl font-bold text-gray-900 mb-6">提交作品到展示墙</h3>
            <form id="showcase-form" onsubmit="handleShowcaseSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">选择项目</label>
                    <select id="submit-project" name="project" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-white" required>
                        <option value="">加载中...</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">作品标题</label>
                    <input id="submit-title" name="title" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" required placeholder="例如：我的智能小车">
                </div>
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-1">上传文件</label>
                    <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:bg-gray-50 transition cursor-pointer" onclick="document.getElementById('submit-file').click()">
                        <i class="fas fa-cloud-upload-alt text-2xl text-gray-400 mb-2"></i>
                        <p class="text-xs text-gray-500" id="file-label">点击选择图片或文档</p>
                        <input type="file" id="submit-file" name="file" class="hidden" onchange="document.getElementById('file-label').textContent = this.files[0]?.name || '点击选择图片或文档'" required>
                    </div>
                </div>
                <div class="pt-4 flex gap-3 justify-end">
                    <button type="button" onclick="document.getElementById('submit-modal').classList.add('hidden')" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded-lg transition font-medium">取消</button>
                    <button type="submit" class="px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-bold shadow-md">确认提交</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let allSubmissions = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await loadSubmissions();
        });

        async function loadSubmissions() {
            const grid = document.getElementById('showcase-grid');
            try {
                // Use the correct API endpoint
                const res = await fetch('/api/v1/showcase');
                if (!res.ok) {
                    throw new Error(`Server returned ${res.status}: ${res.statusText}`);
                }
                const data = await res.json();
                const items = data.items || [];

                // Transform New API data structure (nested) to Old Frontend Format (flat)
                allSubmissions = items.flatMap(item => {
                    const pid = `project${item.project.id}`; // Map ID (1) to 'project1'
                    const attachments = item.showcase.attachments || [];
                    
                    return attachments.map(att => ({
                        project: pid,
                        filename: att.name,
                        url: att.url,
                        fileType: /\.(png|jpg|jpeg|gif|svg|webp)$/i.test(att.name) ? 'image' : 'document',
                        title: item.showcase.title
                    }));
                });
                
                if (allSubmissions.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full text-center py-20">
                            <div class="w-24 h-24 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-6 text-gray-300 text-4xl">
                                <i class="fas fa-images"></i>
                            </div>
                            <h3 class="text-xl font-bold text-gray-500">暂无展示作品</h3>
                            <p class="text-gray-400 mt-2">快去提交你的第一个作品吧！</p>
                            <a href="workspace.html" class="inline-block mt-6 px-6 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition">进入工坊</a>
                        </div>
                    `;
                    return;
                }

                renderProjects('all');

            } catch (err) {
                console.error('Failed to load submissions:', err);
                grid.innerHTML = `
                    <div class="col-span-full text-center text-red-500 py-10">
                        <i class="fas fa-exclamation-triangle text-3xl mb-2"></i><br>
                        加载作品失败<br>
                        <span class="text-xs text-gray-400">${err.message}</span>
                    </div>`;
            }
        }

        function renderProjects(filter) {
            const grid = document.getElementById('showcase-grid');
            grid.innerHTML = '';

            const filtered = filter === 'all' 
                ? allSubmissions 
                : allSubmissions.filter(item => item.project === filter);

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-gray-400 py-10">该分类下暂无作品</div>';
                return;
            }

            filtered.forEach(item => {
                const projectNames = {
                    'project1': 'Vibe Coding',
                    'project2': '产品与项目',
                    'project3': '全栈工程师',
                    'project4': '算法工程师',
                    'project5': '嵌入式工程师',
                    'project6': '综合实践周'
                };
                
                const colors = {
                    'project1': 'blue',
                    'project2': 'purple',
                    'project3': 'green',
                    'project4': 'red',
                    'project5': 'yellow',
                    'project6': 'indigo'
                };

                const pName = projectNames[item.project] || item.project;
                const color = colors[item.project] || 'gray';
                
                // 处理旧数据的路径兼容性
                const fallbackUrl = `/uploads/${item.filename}`; // 旧路径尝试

                // 判断文件类型
                // 后端现在返回 fileType，但也做个正则兜底
                let isImage = false;
                if (item.fileType) {
                    isImage = item.fileType === 'image';
                } else {
                    isImage = item.filename.match(/\.(png|jpg|jpeg|gif|svg|webp)$/i);
                }

                const card = document.createElement('div');
                card.className = 'bg-white rounded-xl overflow-hidden border border-gray-100 shadow-sm project-card group cursor-pointer';
                
                // 点击事件：图片开弹窗，文档新窗口打开
                card.onclick = () => {
                    if (isImage) {
                        openModal(item.url, fallbackUrl);
                    } else {
                        window.open(item.url, '_blank');
                    }
                };
                
                // 生成缩略图内容
                let thumbnailHtml = '';
                if (isImage) {
                    thumbnailHtml = `
                        <img src="${item.url}" 
                             alt="${item.filename}" 
                             class="w-full h-full object-cover transition transform duration-500 group-hover:scale-105"
                             loading="lazy"
                             onerror="this.onerror=null;this.src='${fallbackUrl}';">
                        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/10 transition"></div>
                        <div class="absolute bottom-2 right-2 opacity-0 group-hover:opacity-100 transition">
                            <span class="bg-black/60 text-white text-xs px-2 py-1 rounded backdrop-blur"><i class="fas fa-search-plus"></i></span>
                        </div>
                    `;
                } else {
                    // 文档类型图标生成
                    const ext = item.filename.split('.').pop().toLowerCase();
                    let iconClass = 'fa-file';
                    let iconColor = 'text-gray-400';
                    let bgColor = 'bg-gray-50';
                    
                    if (['doc', 'docx'].includes(ext)) { 
                        iconClass = 'fa-file-word'; 
                        iconColor = 'text-blue-600'; 
                        bgColor = 'bg-blue-50';
                    } else if (['pdf'].includes(ext)) { 
                        iconClass = 'fa-file-pdf'; 
                        iconColor = 'text-red-600'; 
                        bgColor = 'bg-red-50';
                    } else if (['ppt', 'pptx'].includes(ext)) { 
                        iconClass = 'fa-file-powerpoint'; 
                        iconColor = 'text-orange-600'; 
                        bgColor = 'bg-orange-50';
                    } else if (['xls', 'xlsx'].includes(ext)) { 
                        iconClass = 'fa-file-excel'; 
                        iconColor = 'text-green-600'; 
                        bgColor = 'bg-green-50';
                    } else if (['zip', 'rar', '7z'].includes(ext)) { 
                        iconClass = 'fa-file-archive'; 
                        iconColor = 'text-yellow-600'; 
                        bgColor = 'bg-yellow-50';
                    }

                    thumbnailHtml = `
                        <div class="w-full h-full flex flex-col items-center justify-center ${bgColor} transition group-hover:bg-opacity-80">
                            <i class="fas ${iconClass} text-5xl ${iconColor} mb-2 shadow-sm"></i>
                            <span class="text-xs font-bold text-gray-400 uppercase tracking-wide">${ext}</span>
                        </div>
                        <div class="absolute bottom-2 right-2 opacity-0 group-hover:opacity-100 transition">
                            <span class="bg-black/60 text-white text-xs px-2 py-1 rounded backdrop-blur"><i class="fas fa-download"></i></span>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="project-image h-48 bg-gray-100 relative overflow-hidden">
                        ${thumbnailHtml}
                    </div>
                    <div class="p-5">
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-gray-900 group-hover:text-indigo-600 transition truncate pr-2" title="${item.filename}">${item.filename.split('_').slice(1).join('_') || item.filename}</h3>
                        </div>
                        <div class="flex items-center gap-2 mb-3">
                            <span class="text-xs font-bold bg-${color}-100 text-${color}-700 px-2 py-0.5 rounded">${pName}</span>
                            <span class="text-xs text-gray-400">${new Date(item.savedAt).toLocaleDateString()}</span>
                        </div>
                        <div class="flex items-center text-sm text-gray-500">
                            <div class="w-6 h-6 rounded-full bg-gray-200 flex items-center justify-center text-xs text-gray-500 mr-2">
                                <i class="fas fa-user"></i>
                            </div>
                            <span class="truncate">${item.studentName}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
            
            // 添加"虚位以待"卡片
             const placeholder = document.createElement('div');
             placeholder.className = "bg-white rounded-xl overflow-hidden border border-gray-100 shadow-sm project-card group border-dashed border-2 flex flex-col items-center justify-center p-8 text-center min-h-[300px]";
             placeholder.innerHTML = `
                <div class="w-12 h-12 bg-gray-50 rounded-full flex items-center justify-center text-gray-300 text-xl mb-4 group-hover:bg-indigo-50 group-hover:text-indigo-500 transition">
                    <i class="fas fa-plus"></i>
                </div>
                <h3 class="font-bold text-gray-500 mb-1">展示你的作品</h3>
                <p class="text-xs text-gray-400 mb-4">上传截图，让大家看到你的创意</p>
                <button onclick="openSubmitModal()" class="text-indigo-600 text-sm font-bold hover:underline">立即上传作品</button>
             `;
             grid.appendChild(placeholder);
        }

        function filterProjects(category) {
            // Update buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.filter === category) {
                    btn.classList.remove('bg-white', 'text-gray-600', 'border', 'border-gray-200', 'hover:bg-gray-50');
                    btn.classList.add('bg-gray-900', 'text-white');
                } else {
                    btn.classList.add('bg-white', 'text-gray-600', 'border', 'border-gray-200', 'hover:bg-gray-50');
                    btn.classList.remove('bg-gray-900', 'text-white');
                }
            });

            renderProjects(category);
        }

        function openModal(url, fallback) {
            const modal = document.getElementById('image-modal');
            const img = document.getElementById('modal-img');
            
            // 尝试加载主URL，失败则加载 fallback
            img.src = url;
            img.onerror = () => { img.src = fallback; };
            
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('image-modal').classList.add('hidden');
            document.getElementById('modal-img').src = '';
        }

        // Submission Logic
        async function openSubmitModal() {
            const user = window.auth.getAuthUser();
            if (!user) {
                alert('请先登录后再提交作品');
                window.location.href = 'login.html';
                return;
            }

            const modal = document.getElementById('submit-modal');
            const select = document.getElementById('submit-project');
            
            modal.classList.remove('hidden');
            select.innerHTML = '<option>加载中...</option>';

            try {
                const res = await window.auth.apiFetch('/projects');
                const data = await res.json();
                const projects = data.projects || [];
                
                if (projects.length === 0) {
                    select.innerHTML = '<option value="">暂无参与的项目</option>';
                    return;
                }

                select.innerHTML = projects.map(p => `<option value="${p.id}">${p.title}</option>`).join('');
            } catch (err) {
                console.error(err);
                select.innerHTML = '<option value="">加载失败</option>';
            }
        }

        async function handleShowcaseSubmit(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.disabled = true;
            btn.innerText = '上传中...';

            try {
                const formData = new FormData(e.target);
                const projectId = formData.get('project');
                const file = formData.get('file');
                
                if (!projectId || !file) throw new Error('信息不完整');

                formData.append('type', 'showcase');
                // Title is already in formData
                // Content defaults to empty
                formData.append('content', 'User submission from showcase wall');

                const res = await window.auth.apiFetch(`/projects/${projectId}/submissions`, {
                    method: 'POST',
                    body: formData
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.error || '提交失败');
                }

                alert('作品提交成功！');
                document.getElementById('submit-modal').classList.add('hidden');
                e.target.reset();
                document.getElementById('file-label').textContent = '点击选择图片或文档';
                
                // Reload
                await loadSubmissions();

            } catch (err) {
                alert(err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = originalText;
            }
        }
    </script>
</body>
</html>
