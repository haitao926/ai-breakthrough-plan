<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目开题报告 | Project Proposal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="js/auth.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,0.3); }
        
        .field-card { transition: all 0.2s; cursor: pointer; }
        .field-card:hover { transform: translateY(-2px); box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border-color: #6366f1; }
        .field-card.selected { background-color: #eff6ff; border-color: #6366f1; }
        .field-card.selected i { color: #4f46e5; }
        .field-card.selected div { color: #1e1b4b; font-weight: bold; }

        .wbs-item { transition: all 0.2s; }
        .wbs-item:hover { background-color: #f1f5f9; }
    </style>
</head>
<body class="text-gray-800">

    <!-- 导航栏 -->
    <nav class="fixed w-full z-50 bg-white/90 backdrop-blur-md border-b border-gray-200/50 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <!-- Left: Logo -->
                <div class="flex items-center gap-3 shrink-0">
                    <a href="index.html" class="flex items-center gap-2 group">
                        <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold shadow-md group-hover:bg-indigo-700 transition">AI</div>
                        <span class="font-bold text-xl tracking-tight text-gray-900 group-hover:text-indigo-600 transition">破壁计划</span>
                    </a>
                </div>

                <!-- Center: Navigation Links (Stabilized) -->
                <div class="hidden md:flex items-center space-x-1">
                    <a href="knowledge.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-all flex items-center">
                        <i class="fas fa-book-reader mr-2 text-xs"></i>创新知识库
                    </a>
                    <a href="competencies.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-all flex items-center">
                        <i class="fas fa-graduation-cap mr-2 text-xs"></i>学术指导
                    </a>
                    <a href="projects.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-all flex items-center">
                        <i class="fas fa-layer-group mr-2 text-xs"></i>项目库
                    </a>
                    <a href="downloads.html" class="px-3 py-2 rounded-md text-sm font-medium text-gray-500 hover:text-gray-900 hover:bg-gray-50 transition-all flex items-center">
                        <i class="fas fa-folder-open mr-2 text-xs"></i>课程资料库
                    </a>
                </div>

                <!-- Right: Workspace CTA -->
                <div class="flex gap-3 items-center shrink-0">
                    <a href="workspace.html" class="inline-flex items-center justify-center px-4 py-2 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all transform hover:-translate-y-0.5">
                        <i class="fas fa-rocket mr-2"></i> 进入工作台
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="pt-32 pb-20 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
        
        <div class="text-center mb-12">
            <h1 class="text-4xl font-extrabold text-gray-900 mb-4">项目智能开题系统</h1>
            <p class="text-lg text-gray-500">结构化引导，AI 辅助，帮你完成一份高质量的开题报告。</p>
        </div>

        <form id="proposal-form" class="space-y-8">
            
            <!-- Part 0: Field Selection -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="px-8 py-5 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                    <h3 class="font-bold text-gray-900 text-lg">0. 选择学科领域</h3>
                    <a href="competencies.html" target="_blank" class="text-xs font-bold text-indigo-600 hover:text-indigo-800 flex items-center">
                        <i class="fas fa-compass mr-1"></i> 查看赛道指南
                    </a>
                </div>
                <div class="p-8">
                    <p class="text-sm text-gray-500 mb-6">请选择最符合你项目主题的核心学科（可多选）：</p>
                    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-4" id="field-grid">
                        <!-- Fields injected via JS -->
                    </div>
                    <input type="hidden" name="selected_fields" id="selected_fields">
                </div>
            </div>

            <!-- Part 1: Core Info -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="px-8 py-5 border-b border-gray-100 bg-gray-50">
                    <h3 class="font-bold text-gray-900 text-lg">1. 项目核心信息</h3>
                </div>
                <div class="p-8 space-y-6">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">项目名称 (Project Title)</label>
                        <input type="text" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition" placeholder="例如：基于计算机视觉的智能垃圾分类系统">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">项目背景与动机 (Background)</label>
                        <textarea class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition h-32 resize-none" placeholder="详细描述你为什么想做这个项目，它解决了什么实际问题？"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">研究目标与范围 (Goals)</label>
                        <textarea class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition h-32 resize-none" placeholder="明确列出项目要实现的核心功能点 (SMART原则)。"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">技术方案 (Technical Approach)</label>
                        <textarea class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition h-32 resize-none" placeholder="你计划使用哪些主要的技术、框架、算法或硬件？"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">预期成果 (Outcomes)</label>
                        <textarea class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none transition h-32 resize-none" placeholder="项目完成后，你将交付哪些有形的成果？"></textarea>
                    </div>
                </div>
            </div>

            <!-- Part 2: WBS -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="px-8 py-5 border-b border-gray-100 bg-gray-50">
                    <h3 class="font-bold text-gray-900 text-lg">2. 项目工作分解 (WBS)</h3>
                </div>
                <div class="p-8">
                    <p class="text-sm text-gray-500 mb-6">将项目目标分解为具体、可执行的任务。</p>
                    <div id="wbs-container" class="space-y-2 mb-6">
                        <!-- Tasks -->
                    </div>
                    <div class="flex gap-3">
                        <button type="button" id="add-task-btn" class="px-4 py-2 bg-white border border-gray-300 text-gray-700 rounded-lg hover:bg-gray-50 transition text-sm font-bold">
                            <i class="fas fa-plus-circle mr-2"></i> 添加主任务
                        </button>
                        <button type="button" id="ai-generate-wbs-btn" class="px-4 py-2 bg-indigo-50 border border-indigo-100 text-indigo-600 rounded-lg hover:bg-indigo-100 transition text-sm font-bold">
                            <i class="fas fa-magic mr-2"></i> AI 生成建议
                        </button>
                    </div>
                </div>
            </div>

            <div class="text-center pt-8">
                <button type="submit" class="px-10 py-4 bg-green-600 text-white rounded-xl hover:bg-green-700 transition font-bold text-lg shadow-lg transform hover:-translate-y-1">
                    <i class="fas fa-check-circle mr-2"></i> 提交开题报告
                </button>
            </div>

        </form>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-gray-200 py-12">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-sm text-gray-500">
            <p>© 2025 HAI Tech Lab | 开题报告系统</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            
            // --- 1. Fields Rendering ---
            const fields = [
                { name: '应用数学', icon: 'fa-calculator' },
                { name: '建筑与城市', icon: 'fa-city' },
                { name: '艺术', icon: 'fa-palette' },
                { name: '传播媒体', icon: 'fa-broadcast-tower' },
                { name: '计算机科学', icon: 'fa-laptop-code' },
                { name: '跨文化研究', icon: 'fa-globe' },
                { name: '天文地理', icon: 'fa-star' },
                { name: '经济学', icon: 'fa-chart-line' },
                { name: '教育学', icon: 'fa-book' },
                { name: '环境科学', icon: 'fa-tree' },
                { name: '生命科学', icon: 'fa-dna' },
                { name: '语言学', icon: 'fa-comments' },
                { name: '文学', icon: 'fa-pen-nib' },
                { name: '医学', icon: 'fa-heartbeat' },
                { name: '物理与化学', icon: 'fa-flask' },
                { name: '心理学', icon: 'fa-user-md' },
                { name: '公共健康', icon: 'fa-hospital' },
                { name: '社会学', icon: 'fa-users' },
                { name: '体育运动', icon: 'fa-bicycle' },
                { name: '科技与工程', icon: 'fa-cogs' }
            ];

            const fieldGrid = document.getElementById('field-grid');
            const hiddenInput = document.getElementById('selected_fields');
            let selected = new Set();

            fields.forEach(f => {
                const card = document.createElement('div');
                card.className = 'field-card bg-white border border-gray-200 rounded-xl p-4 flex flex-col items-center justify-center text-center h-32 group';
                card.innerHTML = `
                    <i class="fas ${f.icon} text-3xl text-gray-300 mb-3 group-hover:text-indigo-500 transition"></i>
                    <span class="text-xs font-bold text-gray-500 group-hover:text-gray-800 transition">${f.name}</span>
                `;
                
                card.addEventListener('click', () => {
                    const name = f.name;
                    if (selected.has(name)) {
                        selected.delete(name);
                        card.classList.remove('selected');
                    } else {
                        selected.add(name);
                        card.classList.add('selected');
                    }
                    hiddenInput.value = Array.from(selected).join(',');
                });

                fieldGrid.appendChild(card);
            });

            // --- 2. WBS Logic ---
            const wbsContainer = document.getElementById('wbs-container');
            let taskIdCounter = 0;

            function createTaskElement(placeholder = '新任务') {
                const taskId = `task-${taskIdCounter++}`;
                const taskWrapper = document.createElement('div');
                taskWrapper.className = 'wbs-item flex items-center gap-3 bg-gray-50 p-2 rounded-lg border border-gray-200 group';
                taskWrapper.setAttribute('id', taskId);
                taskWrapper.style.marginLeft = '0px';

                taskWrapper.innerHTML = `
                    <div class="cursor-move text-gray-400 hover:text-gray-600 px-2"><i class="fas fa-grip-vertical"></i></div>
                    <input type="text" class="flex-1 bg-transparent border-none outline-none text-sm text-gray-800 font-medium placeholder-gray-400" placeholder="${placeholder}">
                    <div class="flex items-center gap-1 opacity-50 group-hover:opacity-100 transition">
                        <button type="button" class="indent-btn w-8 h-8 rounded hover:bg-gray-200 text-gray-500 transition" title="增加缩进"><i class="fas fa-indent"></i></button>
                        <button type="button" class="outdent-btn w-8 h-8 rounded hover:bg-gray-200 text-gray-500 transition" title="减少缩进"><i class="fas fa-outdent"></i></button>
                        <button type="button" class="remove-btn w-8 h-8 rounded hover:bg-red-100 text-red-500 transition" title="删除任务"><i class="fas fa-trash-alt"></i></button>
                    </div>
                `;
                
                wbsContainer.appendChild(taskWrapper);

                const indentBtn = taskWrapper.querySelector('.indent-btn');
                const outdentBtn = taskWrapper.querySelector('.outdent-btn');
                const removeBtn = taskWrapper.querySelector('.remove-btn');

                indentBtn.addEventListener('click', () => {
                    const currentMargin = parseInt(taskWrapper.style.marginLeft, 10) || 0;
                    taskWrapper.style.marginLeft = `${currentMargin + 24}px`;
                });

                outdentBtn.addEventListener('click', () => {
                    const currentMargin = parseInt(taskWrapper.style.marginLeft, 10) || 0;
                    if (currentMargin >= 24) {
                        taskWrapper.style.marginLeft = `${currentMargin - 24}px`;
                    }
                });

                removeBtn.addEventListener('click', () => {
                    taskWrapper.remove();
                });
            }

            document.getElementById('add-task-btn').addEventListener('click', () => createTaskElement());

            document.getElementById('ai-generate-wbs-btn').addEventListener('click', () => {
                if(wbsContainer.children.length === 0) {
                    createTaskElement('阶段一：需求调研与文献阅读');
                    createTaskElement('阶段二：方案设计与原型开发');
                    createTaskElement('阶段三：测试验证与数据分析');
                    createTaskElement('阶段四：论文撰写与成果展示');
                } else {
                    alert('AI 助手建议：请先完善当前任务结构，再进行生成。');
                }
            });

            // Handle submit
            document.getElementById('proposal-form').addEventListener('submit', function(e) {
                e.preventDefault();
                alert('提交成功！即将跳转到工作台...');
                setTimeout(() => window.location.href = 'workspace.html', 1000);
            });
        });
    </script>
</body>
</html>
