<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>注册 | 科创项目平台</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800">
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="bg-white shadow-xl rounded-2xl p-8 max-w-md w-full space-y-6">
      <div>
        <h1 class="text-2xl font-bold">注册账号</h1>
        <p class="text-gray-500 text-sm mt-1">创建学生或老师账号</p>
      </div>
      <form id="registerForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium mb-1">姓名</label>
          <input name="name" class="w-full border border-gray-300 rounded-lg px-3 py-2" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">邮箱</label>
          <input name="email" type="email" required class="w-full border border-gray-300 rounded-lg px-3 py-2" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">密码</label>
          <input name="password" type="password" required class="w-full border border-gray-300 rounded-lg px-3 py-2" />
        </div>
        <div>
          <label class="block text-sm font-medium mb-1">角色</label>
          <select id="roleSelect" name="role" class="w-full border border-gray-300 rounded-lg px-3 py-2">
            <option value="student">学生</option>
            <option value="teacher">老师</option>
            <option value="judge">评委</option>
          </select>
        </div>
        <div id="inviteCodeWrap" class="hidden">
          <label class="block text-sm font-medium mb-1">邀请码</label>
          <input name="inviteCode" class="w-full border border-gray-300 rounded-lg px-3 py-2" />
          <p class="text-xs text-gray-400 mt-1">首次创建老师账号可不填，后续老师/评委需设置邀请码。</p>
        </div>
        <button type="submit" class="w-full bg-gray-900 hover:bg-gray-800 text-white font-semibold py-2 rounded-lg">注册</button>
        <p id="registerStatus" class="text-sm text-gray-500"></p>
      </form>
      <div class="text-sm text-gray-500 flex items-center justify-between">
        <a href="login.html" class="text-indigo-600 hover:underline">已有账号，去登录</a>
        <a href="index.html" class="hover:underline">返回首页</a>
      </div>
    </div>
  </div>
  <script src="js/auth.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
