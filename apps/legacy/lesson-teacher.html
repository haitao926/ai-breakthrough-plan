<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师驾驶舱 | Lesson Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.2/axios.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .timeline-line { position: absolute; left: 15px; top: 30px; bottom: 0; width: 2px; background: #e5e7eb; z-index: 0; }
        .active-step .timeline-line { background: #4f46e5; }
        .step-dot { z-index: 10; transition: all 0.3s; }
        .active-step .step-dot { background: #4f46e5; border-color: #c7d2fe; transform: scale(1.2); }
        .script-box { border-left: 4px solid #4f46e5; background: #f5f3ff; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen flex flex-col overflow-hidden">

    <!-- Navbar -->
    <nav class="bg-indigo-900 text-white h-16 flex-none flex items-center justify-between px-6 shadow-md z-50">
        <div class="flex items-center gap-4">
            <a href="dashboard.html" class="text-indigo-300 hover:text-white"><i class="fas fa-chevron-left"></i> 返回</a>
            <h1 class="font-bold text-lg" id="lesson-title">加载中...</h1>
            <span class="bg-indigo-700 text-xs px-2 py-1 rounded" id="lesson-duration">45 min</span>
        </div>
        <div class="flex items-center gap-4">
            <div class="text-right">
                <div class="text-xs text-indigo-300">当前环节剩余</div>
                <div class="font-mono font-bold text-xl" id="timer">00:00</div>
            </div>
            <button onclick="toggleTimer()" class="w-10 h-10 rounded-full bg-indigo-600 hover:bg-indigo-500 flex items-center justify-center transition">
                <i class="fas fa-play" id="timer-icon"></i>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar: Timeline -->
        <div class="w-1/4 bg-white border-r border-gray-200 overflow-y-auto p-6 relative">
            <div id="timeline-container" class="space-y-6 relative pl-2">
                <!-- Steps injected here -->
            </div>
        </div>

        <!-- Main Area: Content -->
        <div class="w-3/4 bg-gray-50 overflow-y-auto p-8 relative">
            <div id="step-content" class="max-w-4xl mx-auto space-y-8">
                <!-- Content injected here -->
                <div class="flex items-center justify-center h-full text-gray-400">
                    <p>请在左侧选择一个教学环节</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let lessonData = null;
        let currentStepIndex = 0;
        let timerInterval = null;
        let timeRemaining = 0;

        // Mock getting params from URL (in real app, use ?project=project1&lesson=lesson1)
        const projectId = 'project1';
        const lessonId = 'lesson1';

        document.addEventListener('DOMContentLoaded', async () => {
            try {
                // In a real implementation, this would fetch from /api/lesson/...
                // For this demo, we'll fetch the JSON file directly via the static file server
                const res = await axios.get(`/course-files/${projectId}/lessons/${lessonId}.json`);
                lessonData = res.data;
                initUI();
            } catch (err) {
                console.error(err);
                alert('无法加载课程数据，请检查文件是否存在');
            }
        });

        function initUI() {
            document.getElementById('lesson-title').textContent = lessonData.title;
            document.getElementById('lesson-duration').textContent = lessonData.duration + ' min';
            renderTimeline();
            loadStep(0);
        }

        function renderTimeline() {
            const container = document.getElementById('timeline-container');
            container.innerHTML = `<div class="timeline-line"></div>`;

            lessonData.phases.forEach((phase, index) => {
                const isLast = index === lessonData.phases.length - 1;
                const div = document.createElement('div');
                div.className = `relative pl-8 cursor-pointer group step-item ${index === 0 ? 'active-step' : ''}`;
                div.onclick = () => loadStep(index);
                
                div.innerHTML = `
                    <div class="step-dot absolute left-0 top-1 w-8 h-8 rounded-full bg-white border-2 border-gray-300 flex items-center justify-center text-xs font-bold text-gray-500 group-hover:border-indigo-400 z-10">
                        ${index + 1}
                    </div>
                    <h3 class="font-bold text-gray-800 text-sm group-hover:text-indigo-600 transition">${phase.title}</h3>
                    <p class="text-xs text-gray-400 mt-1">${phase.duration} min</p>
                `;
                container.appendChild(div);
            });
        }

        function loadStep(index) {
            currentStepIndex = index;
            const phase = lessonData.phases[index];
            
            // Update Timeline UI
            document.querySelectorAll('.step-item').forEach((el, i) => {
                if (i === index) el.classList.add('active-step');
                else el.classList.remove('active-step');
            });

            // Reset Timer
            stopTimer();
            timeRemaining = phase.duration * 60;
            updateTimerDisplay();

            // Render Content
            const content = document.getElementById('step-content');
            content.innerHTML = `
                <!-- Header -->
                <div class="flex items-center justify-between border-b border-gray-200 pb-4">
                    <div>
                        <span class="text-indigo-600 font-bold text-sm tracking-wider uppercase">Step ${index + 1}</span>
                        <h2 class="text-3xl font-bold text-gray-900 mt-1">${phase.title}</h2>
                    </div>
                    <div class="flex gap-2">
                        <button class="px-4 py-2 bg-white border border-gray-300 rounded text-sm hover:bg-gray-50 text-gray-600">
                             <i class="fas fa-eye"></i> 预览学生端
                        </button>
                    </div>
                </div>

                <!-- Teacher Script -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2 space-y-6">
                        
                        <!-- Script Card -->
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                            <div class="bg-indigo-50 px-6 py-3 border-b border-indigo-100 flex items-center gap-2">
                                <i class="fas fa-microphone-alt text-indigo-600"></i>
                                <span class="font-bold text-indigo-900 text-sm">话术提词 (Script)</span>
                            </div>
                            <div class="p-6 text-lg leading-relaxed text-gray-800 whitespace-pre-wrap font-medium">${phase.teacher.script}</div>
                        </div>

                        <!-- Actions & Checks -->
                        ${phase.teacher.action ? `
                        <div class="bg-green-50 rounded-lg p-4 border border-green-100 flex gap-3">
                            <i class="fas fa-chalkboard-teacher text-green-600 mt-1"></i>
                            <div>
                                <h4 class="font-bold text-green-800 text-sm">教学动作</h4>
                                <p class="text-green-700 text-sm">${phase.teacher.action}</p>
                            </div>
                        </div>` : ''}

                        ${phase.teacher.check ? `
                        <div class="bg-yellow-50 rounded-lg p-4 border border-yellow-100 flex gap-3">
                            <i class="fas fa-check-circle text-yellow-600 mt-1"></i>
                            <div>
                                <h4 class="font-bold text-yellow-800 text-sm">检查点 (Checkpoint)</h4>
                                <p class="text-yellow-700 text-sm">${phase.teacher.check}</p>
                            </div>
                        </div>` : ''}

                    </div>

                    <!-- Right Sidebar: Student View Preview & Tips -->
                    <div class="space-y-6">
                        
                        <!-- Tips -->
                         <div class="bg-gray-100 rounded-xl p-5 border border-gray-200">
                            <h4 class="font-bold text-gray-600 text-sm mb-3"><i class="fas fa-lightbulb text-yellow-500 mr-2"></i>教学贴士</h4>
                            <p class="text-sm text-gray-500 leading-relaxed">
                                ${phase.teacher.tips || '本环节暂无特殊注意事项。保持节奏，关注后排学生。'}
                            </p>
                        </div>

                        <!-- Solution -->
                        ${phase.teacher.solution ? `
                        <div class="bg-gray-800 rounded-xl p-5 border border-gray-700 text-gray-300">
                            <h4 class="font-bold text-white text-sm mb-3"><i class="fas fa-key text-yellow-400 mr-2"></i>参考答案/资源</h4>
                            <div class="text-xs break-all font-mono bg-black/30 p-2 rounded">
                                ${phase.teacher.solution}
                            </div>
                        </div>` : ''}
                    </div>
                </div>
            `;
        }

        function toggleTimer() {
            if (timerInterval) {
                stopTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            document.getElementById('timer-icon').className = 'fas fa-pause';
            timerInterval = setInterval(() => {
                if (timeRemaining > 0) {
                    timeRemaining--;
                    updateTimerDisplay();
                } else {
                    stopTimer();
                    // Play ding sound?
                }
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            document.getElementById('timer-icon').className = 'fas fa-play';
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
            const s = (timeRemaining % 60).toString().padStart(2, '0');
            document.getElementById('timer').textContent = `${m}:${s}`;
        }
    </script>
</body>
</html>
