<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目管理中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .form-section {
            display: none;
        }
        .form-section.active {
            display: block;
        }
        .prose { max-width: 100%; }
        .modal-bg {
            background-color: rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- 主容器 -->
    <div class="container mx-auto p-4 sm:p-6 lg:p-8">

        <!-- 顶部导航 -->
        <nav class="bg-white p-4 rounded-lg shadow-md flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800 flex items-center">
                <i class="fas fa-tasks mr-3 text-blue-500"></i>
                项目管理中心
            </h1>
            <div class="flex items-center space-x-2">
                <button id="saveBtn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded transition duration-300"><i class="fas fa-save mr-2"></i>保存进度</button>
                <button id="previewBtn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded transition duration-300"><i class="fas fa-eye mr-2"></i>预览与提交</button>
            </div>
        </nav>

        <!-- 表单区 -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <!-- 报告类型选择 -->
            <div class="mb-6">
                <label for="reportType" class="block text-sm font-medium text-gray-700 mb-2">1. 请选择报告类型</label>
                <select id="reportType" class="block w-full p-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500">
                    <option value="kickoff">项目立项报告</option>
                    <option value="midterm">中期进展报告</option>
                    <option value="final">项目结项报告</option>
                </select>
            </div>

            <!-- 立项报告表单 -->
            <div id="kickoff" class="form-section active">
                <h2 class="text-xl font-bold text-gray-800 border-b pb-2 mb-4">项目立项报告</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">项目名称</label>
                        <input type="text" data-field="projectName" class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">团队成员 (每行一个, 格式：姓名-学号)</label>
                        <textarea data-field="teamMembers" rows="3" class="mt-1 block w-full p-2 border border-gray-300 rounded-md"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">项目背景与问题陈述</label>
                        <textarea data-field="kickoff_background" rows="5" class="mt-1 block w-full p-2 border border-gray-300 rounded-md"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">项目目标 (每行一个)</label>
                        <textarea data-field="kickoff_goals" rows="4" class="mt-1 block w-full p-2 border border-gray-300 rounded-md"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">关键创新点 (每行一个)</label>
                        <textarea data-field="kickoff_innovations" rows="3" class="mt-1 block w-full p-2 border border-gray-300 rounded-md"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">技术路线 (描述系统架构、技术选型等)</label>
                        <textarea data-field="kickoff_tech_roadmap" rows="6" class="mt-1 block w-full p-2 border border-gray-300 rounded-md"></textarea>
                    </div>
                </div>
            </div>

            <!-- 中期报告表单 -->
            <div id="midterm" class="form-section">
                <h2 class="text-xl font-bold text-gray-800 border-b pb-2 mb-4">中期进展报告</h2>
                 <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">项目名称</label>
                        <input type="text" data-field="projectName" class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">整体进度概述 (与计划对比)</label>
                        <textarea data-field="midterm_progress_summary" rows="4" class="mt-1 block w-full p-2 border border-gray-300 rounded-md"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">阶段性成果演示链接 (视频或URL)</label>
                        <input type="text" data-field="midterm_demo_link" class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">遇到的主要问题与挑战</label>
                        <textarea data-field="midterm_challenges" rows="5" class="mt-1 block w-full p-2 border border-gray-300 rounded-md"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">后续计划调整</label>
                        <textarea data-field="midterm_plan_adjustments" rows="5" class="mt-1 block w-full p-2 border border-gray-300 rounded-md"></textarea>
                    </div>
                </div>
            </div>

            <!-- 结项报告表单 -->
            <div id="final" class="form-section">
                <h2 class="text-xl font-bold text-gray-800 border-b pb-2 mb-4">项目结项报告</h2>
                <div class="space-y-4">
                     <div>
                        <label class="block text-sm font-medium text-gray-700">项目名称</label>
                        <input type="text" data-field="projectName" class="mt-1 block w-full p-2 border border-gray-300 rounded-md">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">项目目标完成情况</label>
                        <textarea data-field="final_goals_completion" rows="4" class="mt-1 block w-full p-2 border border-gray-300 rounded-md"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">最终成果链接 (应用URL, 源码仓库, 演示视频)</label>
                        <textarea data-field="final_deliverables_links" rows="4" class="mt-1 block w-full p-2 border border-gray-300 rounded-md"></textarea>
                    </div>
                     <div>
                        <label class="block text-sm font-medium text-gray-700">技术实现总结 (架构, 核心技术点)</label>
                        <textarea data-field="final_tech_summary" rows="6" class="mt-1 block w-full p-2 border border-gray-300 rounded-md"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">项目反思与展望</label>
                        <textarea data-field="final_reflection" rows="5" class="mt-1 block w-full p-2 border border-gray-300 rounded-md"></textarea>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 预览与提交 Modal -->
    <div id="previewModal" class="fixed inset-0 modal-bg z-50 hidden items-center justify-center">
        <div class="bg-white rounded-lg shadow-2xl w-full max-w-3xl h-full max-h-[90vh] flex flex-col">
            <div class="p-4 border-b flex justify-between items-center">
                <h2 class="text-xl font-bold">报告预览</h2>
                <button id="closeModalBtn" class="text-gray-500 hover:text-gray-800">&times;</button>
            </div>
            <div id="reportPreview" class="p-6 overflow-y-auto prose">
                <!-- Generated report will be injected here -->
            </div>
            <div class="p-4 border-t bg-gray-50 flex justify-end space-x-2">
                <span id="submitStatus" class="text-sm text-gray-500 self-center"></span>
                <button id="cancelSubmitBtn" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded">返回修改</button>
                <button id="confirmSubmitBtn" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded">确认提交</button>
            </div>
        </div>
    </div>

    <script src="js/project-management.js"></script>
</body>
</html>
