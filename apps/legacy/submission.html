<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>作业提交 | HAI Tech Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Nav -->
    <nav class="fixed w-full z-50 bg-white/90 backdrop-blur border-b border-gray-200 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <a href="index.html" class="w-8 h-8 bg-gray-100 hover:bg-gray-200 rounded-lg flex items-center justify-center text-gray-600 transition">
                        <i class="fas fa-arrow-left"></i>
                    </a>
                    <span class="font-bold text-xl tracking-tight text-gray-900">作业提交中心</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Content -->
    <div class="pt-32 pb-12 max-w-lg mx-auto px-4">
        <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8">
            <h2 class="text-2xl font-bold text-gray-900 mb-6 flex items-center">
                <i class="fas fa-cloud-upload-alt text-indigo-600 mr-3"></i> 提交你的成果
            </h2>
            
            <form id="uploadForm" class="space-y-6">
                <!-- Name -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">姓名 / 组名</label>
                    <input type="text" name="studentName" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition" placeholder="例如：张三 或 第5小组">
                </div>

                <!-- Project -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">所属项目</label>
                    <div class="relative">
                        <select name="project" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none appearance-none bg-white transition cursor-pointer">
                            <option value="" disabled selected>选择项目...</option>
                            <option value="project1">必修01: 体感互动游戏</option>
                            <option value="project2">必修02: 产品思维</option>
                            <option value="project3">必修03: 全栈开发</option>
                            <option value="project4">必修04: AI 算法</option>
                            <option value="project5">必修05: 智能硬件</option>
                            <option value="project6">终极实战: 创业路演</option>
                        </select>
                        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-500">
                            <i class="fas fa-chevron-down text-xs"></i>
                        </div>
                    </div>
                </div>

                <!-- File -->
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">作业文件</label>
                    <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-lg hover:border-indigo-500 hover:bg-indigo-50/30 transition cursor-pointer group relative">
                        <div class="space-y-1 text-center">
                            <i class="fas fa-file-import text-3xl text-gray-400 group-hover:text-indigo-500 transition mb-3"></i>
                            <div class="flex text-sm text-gray-600 justify-center">
                                <label for="file-upload" class="relative cursor-pointer bg-white rounded-md font-medium text-indigo-600 hover:text-indigo-500 focus-within:outline-none focus-within:ring-2 focus-within:ring-offset-2 focus-within:ring-indigo-500">
                                    <span>上传文件</span>
                                    <input id="file-upload" name="file" type="file" class="sr-only" required>
                                </label>
                                <p class="pl-1">或拖拽到这里</p>
                            </div>
                            <p class="text-xs text-gray-500" id="filename-display">支持 zip, pdf, docx, pptx, jpg, png...</p>
                        </div>
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition">
                    确认提交
                </button>
            </form>

            <!-- Status Message -->
            <div id="statusMessage" class="hidden mt-6 p-4 rounded-lg text-sm"></div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-upload');
        const filenameDisplay = document.getElementById('filename-display');
        const form = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const statusMsg = document.getElementById('statusMessage');

        let maxFileSizeBytes = 200 * 1024 * 1024;
        let maxFileSizeLabel = '200MB';

        function formatBytes(bytes) {
            const b = Number(bytes);
            if (!Number.isFinite(b) || b <= 0) return '0B';
            const units = ['B', 'KB', 'MB', 'GB'];
            let size = b;
            let unitIndex = 0;
            while (size >= 1024 && unitIndex < units.length - 1) {
                size /= 1024;
                unitIndex++;
            }
            const rounded = size >= 10 || unitIndex === 0 ? Math.round(size) : Math.round(size * 10) / 10;
            return `${rounded}${units[unitIndex]}`;
        }

        function baseHint() {
            return `支持 zip, pdf, docx, pptx, jpg, png...（最大 ${maxFileSizeLabel}）`;
        }

        async function loadUploadConfig() {
            try {
                const res = await fetch('/api/upload/config', { cache: 'no-store' });
                if (!res.ok) return;
                const cfg = await res.json();
                if (Number.isFinite(cfg?.maxFileSizeBytes) && cfg.maxFileSizeBytes > 0) {
                    maxFileSizeBytes = cfg.maxFileSizeBytes;
                }
                if (typeof cfg?.maxFileSizeLabel === 'string' && cfg.maxFileSizeLabel.trim()) {
                    maxFileSizeLabel = cfg.maxFileSizeLabel.trim();
                } else {
                    maxFileSizeLabel = formatBytes(maxFileSizeBytes);
                }
                filenameDisplay.textContent = baseHint();
            } catch (e) {
                // ignore
            }
        }

        function showError(message) {
            statusMsg.textContent = '❌ ' + message;
            statusMsg.className = 'mt-6 p-4 rounded-lg text-sm bg-red-100 text-red-800';
            statusMsg.classList.remove('hidden');
        }

        function validateSelectedFile(file) {
            if (!file) return true;
            if (file.size > maxFileSizeBytes) {
                showError(`文件过大：${formatBytes(file.size)}，最大允许 ${maxFileSizeLabel}`);
                fileInput.value = '';
                filenameDisplay.textContent = baseHint();
                filenameDisplay.classList.remove('text-indigo-600', 'font-bold');
                return false;
            }
            return true;
        }

        filenameDisplay.textContent = baseHint();
        loadUploadConfig();

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                const file = e.target.files[0];
                if (!validateSelectedFile(file)) return;
                filenameDisplay.textContent = `已选择: ${file.name} (${formatBytes(file.size)})`;
                filenameDisplay.classList.add('text-indigo-600', 'font-bold');
            } else {
                filenameDisplay.textContent = baseHint();
                filenameDisplay.classList.remove('text-indigo-600', 'font-bold');
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const file = fileInput.files?.[0];
            if (!validateSelectedFile(file)) return;
            
            const formData = new FormData(form);
            
            // UI Loading State
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin mr-2"></i> 上传中...';
            statusMsg.classList.add('hidden');
            statusMsg.className = 'hidden mt-6 p-4 rounded-lg text-sm'; // reset classes

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();

                if (response.ok && result.success) {
                    statusMsg.textContent = '✅ 提交成功！文件已保存。';
                    statusMsg.classList.add('bg-green-100', 'text-green-800');
                    form.reset();
                    filenameDisplay.textContent = baseHint();
                    filenameDisplay.classList.remove('text-indigo-600', 'font-bold');
                } else {
                    throw new Error(result.error || '上传失败');
                }
            } catch (err) {
                showError(err.message || '上传失败');
            } finally {
                statusMsg.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = '确认提交';
            }
        });
    </script>
</body>
</html>
