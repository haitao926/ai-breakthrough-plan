<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教师指挥塔 | AI破壁计划</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        body {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            font-family: 'Inter', sans-serif;
            color: #e0e7ff;
        }
        /* 隐藏滚动条但保留功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- 顶部导航 -->
    <header class="bg-indigo-900 bg-opacity-50 border-b border-indigo-700 h-16 flex items-center justify-between px-6 shadow-lg backdrop-blur-md z-10">
        <div class="flex items-center gap-4">
            <a href="index.html" class="w-8 h-8 bg-indigo-500 hover:bg-indigo-400 rounded-lg flex items-center justify-center text-white transition-colors">
                <i class="fas fa-home"></i>
            </a>
            <h1 class="font-bold text-white text-lg flex items-center gap-2">
                <i class="fas fa-tower-observation text-yellow-400"></i>
                教师指挥塔 (Mission Control)
            </h1>
        </div>
        
        <div class="flex items-center gap-4 text-sm text-indigo-200">
            <span id="totalTeamsBadge" class="bg-indigo-800 px-3 py-1 rounded-full border border-indigo-600">
                小组总数: 0
            </span>
            <button onclick="fetchAllTeams()" class="hover:text-white transition-colors">
                <i class="fas fa-sync-alt mr-1"></i> 刷新数据
            </button>
        </div>
    </header>

    <!-- 主布局 -->
    <main class="flex-1 flex overflow-hidden p-6 gap-6">
        
        <!-- 左侧：小组列表 -->
        <div class="w-1/3 flex flex-col gap-4">
            <div class="glass-panel rounded-xl p-4 flex-1 flex flex-col bg-opacity-90 bg-slate-900 border-indigo-800 overflow-hidden">
                <h3 class="font-bold text-gray-800 mb-4 px-2 flex items-center justify-between">
                    <span>小组列表</span>
                    <span class="text-xs font-normal text-gray-500">按活跃时间排序</span>
                </h3>
                <div id="teamList" class="flex-1 overflow-y-auto space-y-3 px-2 pb-2 no-scrollbar">
                    <!-- 动态生成的小组卡片 -->
                    <div class="text-center text-gray-500 mt-10">
                        <i class="fas fa-spinner fa-spin text-2xl mb-2"></i><br>正在扫描全班数据...
                    </div>
                </div>
            </div>
        </div>

        <!-- 右侧：详情视图 -->
        <div class="flex-1 flex flex-col glass-panel rounded-xl bg-white text-gray-800 overflow-hidden relative">
            <!-- 详情头部 -->
            <div class="h-16 border-b border-gray-100 flex items-center justify-between px-6 bg-gray-50">
                <div class="flex items-center gap-3">
                    <div id="detailAvatar" class="w-10 h-10 rounded-full bg-gray-200 flex items-center justify-center text-gray-400">
                        <i class="fas fa-users"></i>
                    </div>
                    <div>
                        <h2 id="detailName" class="font-bold text-lg">请选择一个小组</h2>
                        <p id="detailVision" class="text-xs text-gray-500 truncate max-w-md">点击左侧列表查看详细进度</p>
                    </div>
                </div>
                <div class="flex gap-2">
                    <button onclick="switchView('design')" id="btn-design" class="px-3 py-1 text-sm rounded-md bg-white border shadow-sm text-blue-600 font-medium">设计图</button>
                    <button onclick="switchView('tasks')" id="btn-tasks" class="px-3 py-1 text-sm rounded-md text-gray-500 hover:bg-gray-100 transition">任务表</button>
                </div>
            </div>

            <!-- 详情内容区 -->
            <div class="flex-1 overflow-hidden relative bg-white">
                <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-gray-300">
                    <i class="fas fa-satellite-dish text-6xl mb-4 opacity-50"></i>
                    <p>等待接入信号...</p>
                </div>

                <!-- 视图1: 设计图 -->
                <div id="view-design" class="hidden h-full w-full p-4 overflow-auto">
                    <div id="mermaidOutput" class="flex justify-center min-h-full items-center"></div>
                </div>

                <!-- 视图2: 任务表 -->
                <div id="view-tasks" class="hidden h-full w-full overflow-auto">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 sticky top-0">
                            <tr>
                                <th class="p-4 text-xs text-gray-500">状态</th>
                                <th class="p-4 text-xs text-gray-500">任务内容</th>
                                <th class="p-4 text-xs text-gray-500">负责人</th>
                            </tr>
                        </thead>
                        <tbody id="taskTableBody" class="divide-y divide-gray-100">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

<script>
    mermaid.initialize({ startOnLoad: false, theme: 'default' });
    let currentTeamData = null;

    // --- 核心逻辑 ---

    async function fetchAllTeams() {
        const listContainer = document.getElementById('teamList');
        // listContainer.innerHTML = '<div class="text-center text-gray-500 mt-10"><i class="fas fa-spinner fa-spin"></i></div>';

        try {
            const res = await fetch('/api/all-teams');
            const teams = await res.json();
            
            document.getElementById('totalTeamsBadge').innerText = `小组总数: ${teams.length}`;
            listContainer.innerHTML = '';

            if (teams.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center text-gray-400 mt-10 p-4 border-2 border-dashed border-gray-700 rounded-lg">
                        <p>暂无小组数据</p>
                        <p class="text-xs mt-2">请学生登录驾驶舱后刷新</p>
                    </div>`;
                return;
            }

            teams.forEach(team => {
                const lastActiveDate = new Date(team.lastActive).toLocaleString();
                const progressColor = team.taskStats.progress === 100 ? 'bg-green-500' : 
                                    (team.taskStats.progress > 50 ? 'bg-blue-500' : 'bg-yellow-500');

                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-lg shadow-sm hover:shadow-md cursor-pointer transition-all border-l-4 border-transparent hover:border-blue-500 group";
                card.onclick = () => loadTeamDetail(team.id);
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-2">
                        <h4 class="font-bold text-gray-800 group-hover:text-blue-600">${team.name}</h4>
                        <span class="text-xs text-gray-400">${formatTime(team.lastActive)}</span>
                    </div>
                    <div class="w-full bg-gray-200 rounded-full h-1.5 mb-2">
                        <div class="${progressColor} h-1.5 rounded-full transition-all duration-500" style="width: ${team.taskStats.progress}%"></div>
                    </div>
                    <div class="flex justify-between text-xs text-gray-500">
                        <span><i class="fas fa-check-circle mr-1"></i>${team.taskStats.done}/${team.taskStats.total} 完成</span>
                        <span>ID: ${team.id}</span>
                    </div>
                `;
                listContainer.appendChild(card);
            });

        } catch (err) {
            console.error(err);
            listContainer.innerHTML = '<div class="text-red-400 p-4">加载失败</div>';
        }
    }

    async function loadTeamDetail(teamId) {
        // 1. 获取详情
        try {
            const res = await fetch(`/api/team/${teamId}`);
            const data = await res.json();
            currentTeamData = data;
            
            // 2. 渲染头部
            document.getElementById('detailName').textContent = data.meta.name || teamId;
            document.getElementById('detailVision').textContent = data.meta.vision || '暂无愿景描述...';
            document.getElementById('detailAvatar').innerHTML = `<img src="https://api.dicebear.com/7.x/identicon/svg?seed=${teamId}" class="rounded-full">`;
            document.getElementById('emptyState').classList.add('hidden');

            // 3. 渲染 Mermaid
            const mermaidDiv = document.getElementById('mermaidOutput');
            mermaidDiv.innerHTML = '';
            if (data.design && data.design.mermaid) {
                try {
                    const { svg } = await mermaid.render('graphDiv' + Date.now(), data.design.mermaid);
                    mermaidDiv.innerHTML = svg;
                } catch (e) {
                    mermaidDiv.innerHTML = `<div class="text-red-400 p-4">流程图语法错误</div>`;
                }
            } else {
                mermaidDiv.innerHTML = '<div class="text-gray-400">该组未绘制流程图</div>';
            }

            // 4. 渲染任务表
            const tbody = document.getElementById('taskTableBody');
            tbody.innerHTML = '';
            (data.tasks || []).forEach(task => {
                const tr = document.createElement('tr');
                const statusBadge = task.status === 'done' 
                    ? '<span class="px-2 py-1 bg-green-100 text-green-700 rounded text-xs">完成</span>'
                    : (task.status === 'doing' ? '<span class="px-2 py-1 bg-blue-100 text-blue-700 rounded text-xs">进行中</span>' : '<span class="px-2 py-1 bg-gray-100 text-gray-500 rounded text-xs">待办</span>');
                
                tr.innerHTML = `
                    <td class="p-4 border-b border-gray-50">${statusBadge}</td>
                    <td class="p-4 border-b border-gray-50 font-medium text-gray-700">${task.title}</td>
                    <td class="p-4 border-b border-gray-50 text-gray-500 text-sm">
                        <i class="fas fa-user-circle mr-1"></i> ${task.assignee}
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // 默认显示设计图
            switchView('design');

        } catch (err) {
            console.error(err);
            alert('加载详情失败');
        }
    }

    function switchView(view) {
        ['design', 'tasks'].forEach(v => {
            const el = document.getElementById(`view-${v}`);
            const btn = document.getElementById(`btn-${v}`);
            if (v === view) {
                el.classList.remove('hidden');
                btn.className = "px-3 py-1 text-sm rounded-md bg-white border shadow-sm text-blue-600 font-medium";
            } else {
                el.classList.add('hidden');
                btn.className = "px-3 py-1 text-sm rounded-md text-gray-500 hover:bg-gray-100 transition";
            }
        });
    }

    function formatTime(timestamp) {
        if (!timestamp) return '从未';
        const date = new Date(timestamp);
        const now = new Date();
        const diff = (now - date) / 1000; // seconds
        
        if (diff < 60) return '刚刚';
        if (diff < 3600) return `${Math.floor(diff/60)}分钟前`;
        if (diff < 86400) return `${Math.floor(diff/3600)}小时前`;
        return `${date.getMonth()+1}/${date.getDate()}`;
    }

    // 初始化
    fetchAllTeams();
    // 每10秒自动刷新列表
    setInterval(fetchAllTeams, 10000);

</script>
</body>
</html>
