<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目开题报告 - HAI Tech Lab</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .wbs-editor .task {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            padding: 8px;
            border-radius: 5px;
            background-color: #f8f9fa;
        }
        .wbs-editor .task input {
            flex-grow: 1;
            border: none;
            background: transparent;
        }
        .wbs-editor .task .btn-group {
            margin-left: 10px;
        }
        .wbs-editor .task .handle {
            cursor: move;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container mt-5 mb-5">
        <div class="text-center mb-5">
            <h1 class="display-4"><i class="bi bi-lightbulb-fill"></i> 项目智能开题系统</h1>
            <p class="lead">通过结构化和 AI 辅助，引导你完成一份高质量的开题报告。</p>
        </div>

        <form id="proposal-form">
            <!-- Part 1: Structured Proposal -->
            <div class="card mb-4">
                <div class="card-header">
                    <h3>第一部分：项目核心信息</h3>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="project-title" class="form-label"><strong>1. 项目名称 (Project Title)</strong></label>
                        <input type="text" class="form-control" id="project-title" placeholder="例如：基于计算机视觉的智能垃圾分类系统">
                    </div>
                    <div class="mb-3">
                        <label for="project-background" class="form-label"><strong>2. 项目背景与动机 (Background & Motivation)</strong></label>
                        <textarea class="form-control" id="project-background" rows="4" placeholder="详细描述你为什么想做这个项目，它解决了什么实际问题，有什么社会或技术价值？"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="project-goals" class="form-label"><strong>3. 研究目标与范围 (Goals & Scope)</strong></label>
                        <textarea class="form-control" id="project-goals" rows="4" placeholder="明确列出项目要实现的核心功能点 (SMART原则)。同时，也要说明本项目“不做什么”，以界定清晰的范围。"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="project-tech-approach" class="form-label"><strong>4. 技术方案与实现路径 (Technical Approach)</strong></label>
                        <textarea class="form-control" id="project-tech-approach" rows="4" placeholder="你计划使用哪些主要的技术、框架、算法或硬件？为什么选择它们？"></textarea>
                    </div>
                     <div class="mb-3">
                        <label for="project-outcomes" class="form-label"><strong>5. 预期成果与创新点 (Expected Outcomes & Innovation)</strong></label>
                        <textarea class="form-control" id="project-outcomes" rows="4" placeholder="项目完成后，你将交付哪些有形的成果（如：一个网站、一个APP、一个硬件原型、一篇研究报告）？你认为项目的核心创新点在哪里？"></textarea>
                    </div>
                </div>
            </div>

            <!-- Part 2: WBS Editor -->
            <div class="card">
                <div class="card-header">
                    <h3>第二部分：项目工作分解 (WBS)</h3>
                </div>
                <div class="card-body">
                    <p class="card-text">使用下面的工具将你的项目目标分解为具体、可执行的任务。合理的 WBS 是项目成功的关键。</p>
                    <div class="wbs-editor mb-3" id="wbs-container">
                        <!-- Tasks will be dynamically added here -->
                    </div>
                    <button type="button" class="btn btn-secondary me-2" id="add-task-btn"><i class="bi bi-plus-circle"></i> 添加主任务</button>
                    <button type="button" class="btn btn-primary" id="ai-generate-wbs-btn"><i class="bi bi-magic"></i> AI 生成 WBS 建议</button>
                </div>
            </div>

            <div class="text-center mt-5">
                <button type="submit" class="btn btn-success btn-lg"><i class="bi bi-check2-circle"></i> 提交开题报告</button>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const wbsContainer = document.getElementById('wbs-container');
            const addTaskBtn = document.getElementById('add-task-btn');

            let taskIdCounter = 0;

            // Function to create a new task element
            function createTaskElement(placeholder = '新任务') {
                const taskId = `task-${taskIdCounter++}`;
                const taskWrapper = document.createElement('div');
                taskWrapper.classList.add('task');
                taskWrapper.setAttribute('id', taskId);
                taskWrapper.style.marginLeft = '0px';

                taskWrapper.innerHTML = `
                    <i class="bi bi-grip-vertical handle"></i>
                    <input type="text" class="form-control border-0" placeholder="${placeholder}">
                    <div class="btn-group btn-group-sm">
                        <button type="button" class="btn btn-outline-secondary indent-btn" title="增加缩进"><i class="bi bi-arrow-right-short"></i></button>
                        <button type="button" class="btn btn-outline-secondary outdent-btn" title="减少缩进"><i class="bi bi-arrow-left-short"></i></button>
                        <button type="button" class="btn btn-outline-danger remove-btn" title="删除任务"><i class="bi bi-trash"></i></button>
                    </div>
                `;
                
                wbsContainer.appendChild(taskWrapper);

                // Add event listeners for the new buttons
                taskWrapper.querySelector('.indent-btn').addEventListener('click', () => {
                    const currentMargin = parseInt(taskWrapper.style.marginLeft, 10) || 0;
                    taskWrapper.style.marginLeft = `${currentMargin + 40}px`;
                });

                taskWrapper.querySelector('.outdent-btn').addEventListener('click', () => {
                    const currentMargin = parseInt(taskWrapper.style.marginLeft, 10) || 0;
                    if (currentMargin >= 40) {
                        taskWrapper.style.marginLeft = `${currentMargin - 40}px`;
                    }
                });

                taskWrapper.querySelector('.remove-btn').addEventListener('click', () => {
                    taskWrapper.remove();
                });
            }

            // Event listener for the "Add Task" button
            addTaskBtn.addEventListener('click', () => {
                createTaskElement();
            });

            // Event listener for the AI Generate WBS button (placeholder)
            document.getElementById('ai-generate-wbs-btn').addEventListener('click', () => {
                alert('AI 功能正在开发中！将根据您的项目名称和目标，为您智能生成 WBS 建议。');
                // Mockup of AI functionality
                if(wbsContainer.children.length === 0) {
                    createTaskElement('阶段一：需求分析与设计');
                    createTaskElement('阶段二：核心功能开发');
                    createTaskElement('阶段三：测试与部署');
                    createTaskElement('阶段四：文档撰写');
                }
            });

            // Handle form submission
            document.getElementById('proposal-form').addEventListener('submit', function(e) {
                e.preventDefault();
                alert('开题报告已提交！（此为前端原型，数据未发送到后端）');
                // Later, you would add code here to collect all data and send to a server.
            });
        });
    </script>
</body>
</html>
